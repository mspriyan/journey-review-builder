    /* ── LIBRARY MODAL ── */
    function LibraryModal({ onLoad, onClose }) {
      const [tab, setTab] = useState('saves'); const [saves, setSaves] = useState([]); const [snaps, setSnaps] = useState([]); const [loading, setLoading] = useState(true);
      useEffect(() => { (async () => { try { const sr = await Store.list('jmap:saved:'); const nr = await Store.list('jmap:snap:'); const sk = (sr?.keys || []).sort().reverse(); const nk = (nr?.keys || []).sort().reverse(); const sd = await Promise.all(sk.map(async k => { const r = await Store.get(k); return r ? { key: k, ...JSON.parse(r.value) } : null; })); const nd = await Promise.all(nk.map(async k => { const r = await Store.get(k); return r ? { key: k, ...JSON.parse(r.value) } : null; })); setSaves(sd.filter(Boolean)); setSnaps(nd.filter(Boolean)); } catch (e) { console.error(e); } setLoading(false); })(); }, []);
      const del = async (key, isSave) => { if (!window.confirm('Delete?')) return; await Store.delete(key); if (isSave) setSaves(s => s.filter(x => x.key !== key)); else setSnaps(s => s.filter(x => x.key !== key)); };
      const fmt = ts => { try { return new Date(ts).toLocaleString(); } catch { return ts; } };
      const loadItem = (d) => { if (window.confirm('Load? Unsaved changes will be lost.')) onLoad(d); };
      return (
        <Modal title="📁 Map Library" onClose={onClose} wide>
          <div className="lib-tabs"><button className={`lib-tab${tab === 'saves' ? ' active' : ''}`} onClick={() => setTab('saves')}>Saved ({saves.length})</button><button className={`lib-tab${tab === 'snaps' ? ' active' : ''}`} onClick={() => setTab('snaps')}>Snapshots ({snaps.length})</button></div>
          {loading && <div style={{ textAlign: 'center', padding: 20, color: 'var(--muted)' }}>Loading…</div>}
          {!loading && tab === 'saves' && (saves.length === 0 ? <div style={{ color: 'var(--muted)', fontSize: 12 }}>No saved maps yet.</div> : saves.map(s => (
            <div key={s.key} className="lib-item">
              <div className="lib-item-title">{s.data?.title || 'Untitled'} <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 10 }}>v{s.data?.version}</span></div>
              <div className="lib-item-meta">{fmt(s.savedAt)}</div>
              <div style={{ display: 'flex', gap: 5, marginTop: 6 }}><button className="btn btn-primary btn-xs" onClick={() => loadItem(s.data)}>Load</button><button className="btn btn-danger btn-xs" onClick={() => del(s.key, true)}>Delete</button></div>
            </div>
          )))}
          {!loading && tab === 'snaps' && (snaps.length === 0 ? <div style={{ color: 'var(--muted)', fontSize: 12 }}>No snapshots yet.</div> : snaps.map(s => (
            <div key={s.key} className="lib-item">
              <div className="lib-item-title">{s.label || 'Snapshot'}</div>
              <div className="lib-item-meta">{fmt(s.savedAt)}</div>
              <div style={{ display: 'flex', gap: 5, marginTop: 6 }}><button className="btn btn-primary btn-xs" onClick={() => loadItem(s.data)}>Restore</button><button className="btn btn-danger btn-xs" onClick={() => del(s.key, false)}>Delete</button></div>
            </div>
          )))}
          <div className="mfooter"><button className="btn btn-ghost" onClick={onClose}>Close</button></div>
        </Modal>
      );
    }

          </div>
          <div className="fg" style={{ marginTop: 4 }}>
            <label className="flabel">Flow Connections</label>
            <div className="toggle-row" style={{ marginTop: 6 }} onClick={() => setConnectors(v => !v)}>
              <div className={`sw${connectors ? ' on' : ''}`}><div className="sw-k" /></div>
              <span style={{ fontSize: 12 }}>Show flow connection lines between steps</span>
            </div>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 4, lineHeight: 1.5 }}>
              When enabled, dotted grey lines with arrowheads are drawn between connected steps in View Mode. Can also be toggled directly from the legend bar.
            </div>
          </div>
          <div className="fg" style={{ marginTop: 8 }}>

              <option value="A3 landscape">A3 Landscape (Default)</option>
              <option value="A3 portrait">A3 Portrait</option>
              <option value="A4 landscape">A4 Landscape</option>
              <option value="A4 portrait">A4 Portrait</option>
              <option value="letter landscape">US Letter Landscape</option>

            </select>
            <div style={{ marginTop: 9, padding: '8px 12px', background: 'var(--surface)', borderRadius: 8, fontSize: 11, color: 'var(--muted)', lineHeight: 1.6 }}>
              Choose the page size and orientation for PDF exports or printing. Wait for the browser print dialogue to open. Setting to landscape usually helps prevent cutting off long journey maps.
            </div>
          </div>
          <div className="fg" style={{ marginTop: 8 }}>
            <label className="flabel">🛠️ Numbering Utilities</label>
            <div style={{ marginTop: 6, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              <button
                className="btn btn-outline btn-sm"
                onClick={() => { if (window.confirm('This will wipe out ALL step numbers across the journey. Proceed?')) onClear(); }}
                title="Wipe out all step numbers"
              >
                🗑️ Clear All
              </button>
              <button
                className="btn btn-outline btn-sm"
                onClick={() => { if (window.confirm('This will re-calculate sequential numbering (1, 2, 3...) for all active steps. Proceed?')) onResequence(); }}
                title="Re-calculate sequential numbers"
              >
                🔢 Redo All (Reset)
              </button>
            </div>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 6, lineHeight: 1.5 }}>
              Useful after moving, deleting, or duplicating cards to ensure a clean, sequential flow of step numbers.
            </div>
            <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 10 }}>
              <input
                id="toggle-auto-number"
                type="checkbox"
                checked={autoNumber}
                onChange={e => setAutoNumber(e.target.checked)}
                style={{ cursor: 'pointer', width: 14, height: 14 }}
              />
              <label htmlFor="toggle-auto-number" style={{ fontSize: 12, fontWeight: 600, color: 'var(--primary)', cursor: 'pointer' }}>
                Auto-maintain sequential numbering
              </label>
            </div>
          </div>
          <div className="mfooter">
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={() => onSave(defaultWidth, connectors, printLayout, autoNumber)}>Save</button>
          </div>
        </Modal>
      );
    }

      const hasOverride = stage.width != null;

        <Modal title={`↔ Column Width — ${stage.name}`} onClose={onClose}>
          <div className="fg">
            <label className="flabel">Stage Column Width</label>

              {presets.map(p => (

    function ExportImportModal({ onExport, onImportFile, onClose }) {
      const [tab, setTab] = useState('export');
      const [fmt, setFmt] = useState('json');
      const [status, setStatus] = useState(null);
      const [preview, setPreview] = useState(null);
      const [pendingData, setPendingData] = useState(null);
      const [drag, setDrag] = useState(false);
      const fileRef = useRef(null);

      const FMTS = [
        { v: 'json', ic: '📦', l: 'JSON Data', grp: 'data', desc: 'Full data backup — stages, personas, lanes, settings and screen images. Use Import to restore on any device.' },
        { v: 'html', ic: '🌐', l: 'Standalone HTML', grp: 'data', desc: 'Complete journey map with embedded data — open in any browser, includes all styles and embedded JSON data for sharing.' },
        { v: 'svg', ic: '🔷', l: 'SVG Vector', grp: 'image', desc: 'Infinitely scalable vector — edit in Figma or Illustrator, or use for large-format print.' },
        { v: 'pdf', ic: '📄', l: 'Print / PDF', grp: 'print', desc: 'Opens browser print dialog — select A3 Landscape for best results.' },
      ];

      const handleExport = () => {
        setStatus({ type: 'info', msg: 'Generating export…' });
        onExport(fmt);
        if (fmt !== 'pdf') {
          setTimeout(() => {
            setStatus({ type: 'success', msg: 'Export complete — check your downloads.' });
            setTimeout(() => onClose(), 1000);
          }, 800);
        }
        else { setStatus(null); onClose(); }
      };

      /* ── Migrate imported JSON to current schema ── */
      const migrateImport = (p) => {
        // ── Top-level fields ──────────────────────────────────────────────────
        if (!p.title) p.title = 'Untitled Journey';
        if (!p.version) p.version = 'V1';
        if (!p.activePersona) p.activePersona = p.personas?.[0]?.id || 'p-mass';
        if (p.autoNumber === undefined) p.autoNumber = false;
        if (!p.notes) p.notes = '';
        if (!Array.isArray(p.manualConnectors)) p.manualConnectors = [];
        if (!p.links || !Array.isArray(p.links)) p.links = [];
        p.links.forEach(lk => {
          if (!lk.id) lk.id = uid();
          if (!lk.type) lk.type = 'custom';
          if (!lk.label) lk.label = '';
          if (!lk.url) lk.url = '';
        });
        if (!p.upcomingProjects || !Array.isArray(p.upcomingProjects)) p.upcomingProjects = [];
        if (!p.markets) p.markets = { SG: false, MY: false, TH: false, ID: false };
        // fill missing market keys
        ['SG', 'MY', 'TH', 'ID'].forEach(k => { if (p.markets[k] === undefined) p.markets[k] = false; });
        if (!p.defaultStageWidth || typeof p.defaultStageWidth !== 'number') p.defaultStageWidth = DEFAULT_STAGE_WIDTH;
        if (!p.lineStyle) p.lineStyle = 'orthogonal';

        // ── Personas ─────────────────────────────────────────────────────────
        if (!p.personas || !Array.isArray(p.personas) || p.personas.length === 0) {
          p.personas = clone(INIT.personas);
        }
        p.personas.forEach(pa => {
          if (!pa.id) pa.id = 'p-' + uid();
          if (!pa.label) pa.label = 'Persona';
          if (!pa.description) pa.description = '';
          if (!pa.jtbd) pa.jtbd = '';
          // legacy field rename
          if (!pa.sentiment && pa.sentimentAsis) pa.sentiment = pa.sentimentAsis;
          if (!Array.isArray(pa.sentiment)) pa.sentiment = p.stages.map(() => 0);
          while (pa.sentiment.length < p.stages.length) pa.sentiment.push(0);
          pa.sentiment = pa.sentiment.slice(0, p.stages.length).map(v => {
            if (v === 1 || v === 0 || v === -1) return v;
            return v > 20 ? 1 : v < -20 ? -1 : 0;
          });
        });

        // ── Lanes ─────────────────────────────────────────────────────────────
        if (!p.lanes || !Array.isArray(p.lanes)) p.lanes = [];
        p.lanes.forEach(l => {
          if (!l.id) l.id = 'l-' + uid();
          if (!l.label) l.label = 'Lane';
          if (!l.icon) l.icon = '📱';
          if (!l.bg) l.bg = '#ebf2ff';
          if (!l.border) l.border = '#0055b3';
          if (!l.text) l.text = '#003b82';
          if (l.hidden === undefined) l.hidden = false;
        });

        // ── Row settings ──────────────────────────────────────────────────────
        if (!p.rowSettings || typeof p.rowSettings !== 'object') p.rowSettings = clone(DEFAULT_ROW_SETTINGS);
        ['ex', 'help', 'systems', 'sentiment'].forEach(key => {
          if (!p.rowSettings[key]) p.rowSettings[key] = clone(DEFAULT_ROW_SETTINGS[key]);
          else {
            const def = DEFAULT_ROW_SETTINGS[key];
            if (!p.rowSettings[key].icon) p.rowSettings[key].icon = def.icon;
            if (!p.rowSettings[key].label) p.rowSettings[key].label = def.label;
            if (!p.rowSettings[key].bg) p.rowSettings[key].bg = def.bg;
            if (!p.rowSettings[key].border) p.rowSettings[key].border = def.border;
            if (!p.rowSettings[key].text) p.rowSettings[key].text = def.text;
            if (p.rowSettings[key].hidden === undefined) p.rowSettings[key].hidden = false;
          }
        });

        // ── Row order ─────────────────────────────────────────────────────────
        if (!p.rowOrder || !Array.isArray(p.rowOrder)) {
          p.rowOrder = [...p.lanes.map(l => l.id), 'systems', 'ex', 'help'];
        } else {
          // ensure all built-in rows present (systems was added later)
          if (!p.rowOrder.includes('systems')) {
            const exIdx = p.rowOrder.indexOf('ex');
            p.rowOrder.splice(exIdx >= 0 ? exIdx : p.rowOrder.length, 0, 'systems');
          }
          // remove removed/legacy rows
          const validRows = new Set([...p.lanes.map(l => l.id), 'systems', 'ex', 'help']);
          p.rowOrder = p.rowOrder.filter(r => validRows.has(r));
          // add any missing lane ids
          p.lanes.forEach(l => { if (!p.rowOrder.includes(l.id)) p.rowOrder.push(l.id); });
        }

        // ── Stages ────────────────────────────────────────────────────────────
        const migrateStep = (s) => {
          if (!s.id) s.id = uid();
          if (s.number === undefined) s.number = '';
          if (s.description === undefined) s.description = '';
          if (!s.subDesc) s.subDesc = '';
          if (!Array.isArray(s.additionalDescriptions)) {
            s.additionalDescriptions = s.subDesc ? [s.subDesc] : [];
          } else {
            s.additionalDescriptions = s.additionalDescriptions.map(v => String(v || '').trim()).filter(Boolean);
            if (!s.subDesc && s.additionalDescriptions[0]) s.subDesc = s.additionalDescriptions[0];
          }
          if (!s.emotion) s.emotion = '';
          if (s.isFriction === undefined) s.isFriction = false;
          if (s.isAlternate === undefined) s.isAlternate = false;
          if (!Array.isArray(s.connects)) s.connects = [];
          s.connects.forEach(c => {
            if (!c.id) c.id = uid();
            if (!c.to) c.to = '';
            if (!c.type || c.type !== 'alternate') c.type = c.type === 'alternate' ? 'alternate' : 'exception';
            if (!c.label) c.label = '';
            if (!c.style || !['straight', 'curved', 'orthogonal'].includes(c.style)) c.style = 'orthogonal';
            if (c.toRef && typeof c.toRef === 'object') {
              c.toRef = {
                sid: c.toRef.sid || '',
                stId: c.toRef.stId || '',
                path: c.toRef.path || ''
              };
            } else {
              delete c.toRef;
            }
          });
          if (s.tobeState !== undefined) delete s.tobeState;
          if (s.customBadge === undefined) s.customBadge = null;
          else if (s.customBadge && typeof s.customBadge === 'object') {
            if (!s.customBadge.text) s.customBadge.text = '';
            if (!s.customBadge.color) s.customBadge.color = '#3B82F6';
          }
          if (s.isDeleted === undefined) s.isDeleted = false;
          if (s.keyFinding === undefined) s.keyFinding = '';
          return s;
        };

        p.manualConnectors = p.manualConnectors
          .filter(c => c && c.from && c.to)
          .map(c => ({
            id: c.id || uid(),
            from: { sid: c.from.sid || '', stId: c.from.stId || '', path: c.from.path || '', side: c.from.side || 'right' },
            to: { sid: c.to.sid || '', stId: c.to.stId || '', path: c.to.path || '', side: c.to.side || 'left' }
          }));

        p.stages.forEach(st => {
          if (!st.id) st.id = uid();
          if (!st.name) st.name = 'Stage';
          // column width override — null/undefined means use default
          if (st.width !== undefined && typeof st.width !== 'number') delete st.width;
          // screens
          if (!st.screens || !Array.isArray(st.screens)) st.screens = [null];
          // happyFlow
          if (!st.happyFlow || typeof st.happyFlow !== 'object') st.happyFlow = { rows: [{ id: uid(), name: 'Row 1', steps: [] }] };
          if (!st.happyFlow.rows) {
            st.happyFlow.rows = st.happyFlow.steps?.length > 0 ? [{ id: uid(), name: 'Row 1', steps: st.happyFlow.steps }] : [{ id: uid(), name: 'Row 1', steps: [] }];
          }
          st.happyFlow.rows.forEach(row => { if (row.steps) row.steps.forEach(migrateStep); });
          // exceptions
          if (!st.exceptions || typeof st.exceptions !== 'object') st.exceptions = { steps: [] };
          if (!Array.isArray(st.exceptions.steps)) st.exceptions.steps = [];
          st.exceptions.steps.forEach(migrateStep);
          // digitalHelp — handle legacy string format
          if (typeof st.digitalHelp === 'string') {
            const txt = st.digitalHelp.trim();
            st.digitalHelp = { steps: txt ? [makeStep('H', txt, { emotion: '💡' })] : [] };
          } else if (!st.digitalHelp || typeof st.digitalHelp !== 'object') {
            st.digitalHelp = { steps: [] };
          }
          if (!Array.isArray(st.digitalHelp.steps)) st.digitalHelp.steps = [];
          st.digitalHelp.steps.forEach(migrateStep);
          // systems
          if (typeof st.systemsRow === 'string') {
            const lines = st.systemsRow.split('\n').filter(Boolean);
            st.systems = { steps: lines.map(line => makeStep('', line)) };
            delete st.systemsRow;
          } else if (!st.systems || typeof st.systems !== 'object') {
            st.systems = { steps: [] };
          }
          if (!Array.isArray(st.systems.steps)) st.systems.steps = [];
          st.systems.steps.forEach(migrateStep);
          // compliance
          if (!st.compliance || typeof st.compliance !== 'object') {
            st.compliance = { flagged: false, citation: '', owner: '', note: '' };
          } else {
            if (typeof st.compliance.flagged !== 'boolean') st.compliance.flagged = false;
            if (!st.compliance.citation) st.compliance.citation = '';
            if (!st.compliance.owner) st.compliance.owner = '';
            if (!st.compliance.note) st.compliance.note = '';
          }
          // lanes — ensure every known lane id exists, prune unknowns
          if (!st.lanes || typeof st.lanes !== 'object') st.lanes = {};
          p.lanes.forEach(l => {
            if (!st.lanes[l.id]) st.lanes[l.id] = { rows: [{ id: uid(), name: 'Row 1', steps: [] }] };
            if (!st.lanes[l.id].rows) st.lanes[l.id].rows = [{ id: uid(), name: 'Row 1', steps: [] }];
            st.lanes[l.id].rows.forEach(row => { if (row.steps) row.steps.forEach(migrateStep); });
          });
        });

        return p;
      };

      /* ── Build rich preview summary from migrated data ── */
      const buildPreview = (d) => {
        const regulatedCount = d.stages.filter(s => s.compliance?.flagged).length;
        const stepsTotal = d.stages.reduce((n, st) => {
          (st.happyFlow?.rows || []).forEach(r => { n += r.steps?.length || 0; });
          n += (st.exceptions?.steps?.length || 0);
          Object.values(st.lanes || {}).forEach(l => { (l.rows || []).forEach(r => { n += r.steps?.length || 0; }); });
          n += (st.digitalHelp?.steps?.length || 0) + (st.systems?.steps?.length || 0);
          return n;
        }, 0);
        const keyFindings = d.stages.reduce((n, st) => {
          const check = arr => (arr || []).forEach(s => { if (s.keyFinding) n++; });
          (st.happyFlow?.rows || []).forEach(r => check(r.steps));
          check(st.exceptions?.steps);
          check(st.digitalHelp?.steps); check(st.systems?.steps);
          Object.values(st.lanes || {}).forEach(l => (l.rows || []).forEach(r => check(r.steps)));
          return n;
        }, 0);
        const widthOverrides = d.stages.filter(s => s.width != null).length;
        return {
          title: d.title,
          version: d.version || '—',
          stages: d.stages.length,
          regulated: regulatedCount,
          personas: d.personas.length,
          lanes: d.lanes.length,
          totalSteps: stepsTotal,
          keyFindings,
          links: (d.links || []).length,
          upcomingProjects: (d.upcomingProjects || []).length,
          markets: Object.entries(d.markets || {}).filter(([, v]) => v).map(([k]) => k).join(', ') || 'None',
          defaultStageWidth: d.defaultStageWidth || DEFAULT_STAGE_WIDTH,
          widthOverrides,
          rowOrder: (d.rowOrder || []).join(' → '),
          hasNotes: !!(d.notes && d.notes !== '<p></p>' && d.notes !== ''),
        };
      };

      const readFile = (file) => {
        if (!file) return;
        if (!file.name.endsWith('.json')) { setStatus({ type: 'error', msg: 'Only .json files are supported.' }); return; }
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const p = JSON.parse(ev.target.result);
            if (!p.title || !p.stages) { setStatus({ type: 'error', msg: 'Invalid file — missing required fields (title, stages).' }); return; }
            if (!Array.isArray(p.stages) || p.stages.length === 0) { setStatus({ type: 'error', msg: 'File has no stages.' }); return; }
            const migrated = migrateImport(p);
            setPendingData(migrated);
            setPreview(buildPreview(migrated));
            setStatus({ type: 'success', msg: 'File validated — review the summary below then load.' });
          } catch (err) { setStatus({ type: 'error', msg: 'Could not parse file: ' + err.message }); }
        };
        reader.readAsText(file);
      };

      const handleDrop = e => { e.preventDefault(); setDrag(false); readFile(e.dataTransfer.files[0]); };
      const handleFileChange = e => { readFile(e.target.files[0]); if (fileRef.current) fileRef.current.value = ''; };

      const PreviewRow = ({ label, value, accent }) => (
        <div className="import-preview-row">
          <span>{label}</span>
          <span style={accent ? { color: 'var(--accent)', fontWeight: 700 } : {}}>{value}</span>
        </div>
      );

      return (
        <Modal title="Export & Import" onClose={onClose} wide>
          <div className="io-tabs">
            <button className={`io-tab${tab === 'export' ? ' sel' : ''}`} onClick={() => { setTab('export'); setStatus(null); }}>⬇️ Export</button>
            <button className={`io-tab${tab === 'import' ? ' sel' : ''}`} onClick={() => { setTab('import'); setStatus(null); setPendingData(null); setPreview(null); }}>⬆️ Import</button>
          </div>

          {tab === 'export' && <>
            {/* ── Format cards ── */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 8 }}>
              {FMTS.filter(f => f.grp === 'data' || f.grp === 'image').map(f => (
                <button key={f.v} className={`fmt-card${fmt === f.v ? ' sel' : ''}`} onClick={() => { setFmt(f.v); setStatus(null); }}>
                  <span className="fmt-card-icon">{f.ic}</span>
                  <span className="fmt-card-title">{f.l}</span>
                  <span className="fmt-card-desc">{f.desc}</span>
                </button>
              ))}
            </div>
            {/* ── PDF full-width card ── */}
            {FMTS.filter(f => f.grp === 'print').map(f => (
              <button key={f.v} className={`fmt-card${fmt === f.v ? ' sel' : ''}`}
                style={{ display: 'flex', alignItems: 'center', gap: 12, width: '100%', marginBottom: 4 }}
                onClick={() => { setFmt(f.v); setStatus(null); }}>
                <span style={{ fontSize: 26, flexShrink: 0 }}>{f.ic}</span>
                <span>
                  <span className="fmt-card-title" style={{ display: 'block' }}>{f.l}</span>
                  <span className="fmt-card-desc">{f.desc}</span>
                </span>
              </button>
            ))}
            {/* ── SVG quality note ── */}
            {fmt === 'svg' && (

              </div>

          {tab === 'import' && <>
            <div

              <div style={{ fontSize: 28, marginBottom: 7 }}>📂</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--text)', marginBottom: 3 }}>Drop a JSON file here</div>
              <div style={{ fontSize: 10.5, color: 'var(--muted)' }}>or click to browse — only <strong>.json</strong> journey exports are accepted</div>
            </div>

            {status && <div className={`exp-hint ${status.type}`} style={{ marginTop: 9 }}>{status.msg}</div>}

            {preview && <div className="import-preview">
              <div className="import-preview-title">
                📋 {preview.title}

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 16px', marginTop: 6 }}>

                  <PreviewRow label="Regulated stages" value={preview.regulated} accent={preview.regulated > 0} />
                  <PreviewRow label="Custom lane rows" value={preview.lanes} />
                  <PreviewRow label="Personas" value={preview.personas} />
                  <PreviewRow label="Active markets" value={preview.markets} />

                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.06em', color: 'var(--muted)', marginBottom: 4 }}>Content</div>

                  <PreviewRow label="Key findings" value={preview.keyFindings} accent={preview.keyFindings > 0} />
                  <PreviewRow label="Artefact links" value={preview.links} />

    /* ── RICH TEXT EDITOR ── */
    function RichTextEditor({ value, onChange, placeholder, minHeight }) {
      const ref = useRef(null);
      const [focused, setFocused] = useState(false);
      useEffect(() => {
        if (ref.current && ref.current.innerHTML !== value) { ref.current.innerHTML = value || ''; }
      }, []);// only on mount
      const exec = (cmd, val = null) => { document.execCommand(cmd, false, val); ref.current?.focus(); onChange(ref.current?.innerHTML || ''); };
      const isActive = cmd => document.queryCommandState(cmd);
      const toolbarBtns = [
        { cmd: 'bold', icon: 'B', style: { fontWeight: 'bold' } },
        { cmd: 'italic', icon: 'I', style: { fontStyle: 'italic' } },
        { cmd: 'underline', icon: 'U', style: { textDecoration: 'underline' } },
        { cmd: 'divider' },
        { cmd: 'insertUnorderedList', icon: '≡' },
        { cmd: 'insertOrderedList', icon: '1.' },
        { cmd: 'divider' },
        { cmd: 'formatBlock', val: 'h2', icon: 'H2' },
        { cmd: 'formatBlock', val: 'h3', icon: 'H3' },
        { cmd: 'formatBlock', val: 'p', icon: '¶' },
        { cmd: 'divider' },
        { cmd: 'removeFormat', icon: '✕', title: 'Clear formatting' },
      ];
      return (
        <div className="rt-wrap" style={{ borderColor: focused ? 'var(--primary2)' : 'var(--border)' }}>
          <div className="rt-toolbar">
            {toolbarBtns.map((b, i) => b.cmd === 'divider' ? <div key={i} className="rt-divider" /> : (
              <button key={b.cmd + (b.val || '')} className={`rt-btn${isActive(b.cmd) ? ' active' : ''}`} title={b.title || b.cmd}
                style={b.style || {}}
                onMouseDown={e => { e.preventDefault(); exec(b.cmd, b.val || null); }}>
                {b.icon}
              </button>
            ))}
          </div>
          <div
            ref={ref}
            className="rt-editor"
            contentEditable
            suppressContentEditableWarning
            data-placeholder={placeholder || 'Type here…'}
            style={{ minHeight: minHeight || 80 }}
            onFocus={() => setFocused(true)}
            onBlur={() => { setFocused(false); onChange(ref.current?.innerHTML || ''); }}
            onInput={() => onChange(ref.current?.innerHTML || '')}
          />
        </div>
      );
    }

    /* ── SENTIMENT ROW ── */
    const SENT_STATES = [
      { v: 1, emoji: '😊', label: 'Positive', color: '#18a558', bg: '#dcfce7', zone: 'top' },
      { v: 0, emoji: '😐', label: 'Neutral', color: '#64748b', bg: '#f1f5f9', zone: 'mid' },
      { v: -1, emoji: '😞', label: 'Negative', color: '#e74c3c', bg: '#fee2e2', zone: 'bot' },
    ];
    function sentStateOf(v) { return SENT_STATES.find(s => s.v === v) || SENT_STATES[1]; }

    function SentimentRow({ stages, data, editMode, onSentimentChange, onHide, rowSettings }) {
      const rs = rowSettings || DEFAULT_ROW_SETTINGS.sentiment;
      const persona = data.personas.find(p => p.id === data.activePersona) || data.personas[0];
      const rawSent = persona?.sentiment || (data.stages || []).map(() => 0);
      const sentiment = [0, ...rawSent, 0];
      const svgRef = useRef(null);

      const CH = 120;
      const [pointsX, setPointsX] = useState(stages.map(() => 100));
      const [stageX, setStageX] = useState(stages.map(() => 0));
      const [totalW, setTotalW] = useState(800);

      useLayoutEffect(() => {
        const update = () => {
          const svgEl = svgRef.current;
          if (!svgEl) return;
          const svgRect = svgEl.getBoundingClientRect();
          const ths = Array.from(document.querySelectorAll('.stage-th'));
          if (ths.length > 0) {
            const newX = [];
            const newStageX = [];
            ths.forEach(th => {
              const r = th.getBoundingClientRect();
              newStageX.push(r.left - svgRect.left);
              newX.push((r.left - svgRect.left) + r.width / 2);
            });
            setPointsX(newX);
            setStageX(newStageX);
          }
          setTotalW(svgRect.width || parseInt(svgEl.getAttribute('width')) || 800);
        };
        update();
        const tid = setTimeout(update, 100);
        window.addEventListener('resize', update);
        return () => { clearTimeout(tid); window.removeEventListener('resize', update); };
      }, [stages, data.defaultStageWidth]);

      /* Three fixed Y positions — centred in each zone */
      const POS_Y = 22; const NEU_Y = CH / 2; const NEG_Y = CH - 22;
      const yOf = v => v === 1 ? POS_Y : v === -1 ? NEG_Y : NEU_Y;
      /* x centre of each stage = left edge + half width */
      const xOf = i => pointsX[i] || 0;

      const pts = sentiment.map((v, i) => ({ x: xOf(i), y: yOf(v), v, isCap: i === 0 || i === sentiment.length - 1 }));

      /* Catmull-Rom smooth bezier */
      const smoothPath = points => {
        if (points.length === 0) return '';
        if (points.length === 1) return `M${points[0].x},${points[0].y}`;
        let d = `M${points[0].x},${points[0].y}`;
        const t = 0.4;
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[Math.max(0, i - 1)], p1 = points[i], p2 = points[i + 1], p3 = points[Math.min(points.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) * t, cp1y = p1.y + (p2.y - p0.y) * t;
          const cp2x = p2.x - (p3.x - p1.x) * t, cp2y = p2.y - (p3.y - p1.y) * t;
          d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x},${p2.y}`;
        }
        return d;
      };

      /* Click cycles through positive → neutral → negative → positive */
      const cycleState = i => {
        if (i === 0 || i === sentiment.length - 1) return;
        const idx = i - 1;
        const cur = rawSent[idx] ?? 0;
        const next = cur === 1 ? 0 : cur === 0 ? -1 : 1;
        onSentimentChange(idx, next);
      };

      /* Gradient definition id */
      const gradId = 'sent-grad-' + Math.abs(rs.border.replace(/[^0-9a-f]/gi, '').slice(0, 4));

      return (
        <tr style={{ borderBottom: '1px solid #d1fae5' }}>
          <td className="rl" style={{ background: rs.bg, color: rs.text, borderColor: rs.border, verticalAlign: 'middle', paddingTop: 8 }}>
            <div style={{ fontSize: 16, marginBottom: 3 }}>{rs.icon}</div>
            <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.04em' }}>{rs.label}</div>
            <div style={{ fontSize: 8, color: rs.text, opacity: .7, marginTop: 3, fontStyle: 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 88 }}>{persona?.label}</div>
            {/* Legend pills */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginTop: 5, alignItems: 'center' }}>
              {SENT_STATES.map(s => <span key={s.v} style={{ fontSize: 8, fontWeight: 600, color: s.color, display: 'flex', alignItems: 'center', gap: 2 }}><span style={{ fontSize: 10 }}>{s.emoji}</span>{s.label}</span>)}
            </div>
            <button style={{ display: 'block', margin: '6px auto 0', background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: rs.text, opacity: .7 }} onClick={onHide} title="Hide Sentiment Curve">👁️</button>
          </td>
          <td colSpan={stages.length + (editMode ? 1 : 0)} style={{ padding: 0, background: rs.bg }}>
            <svg ref={svgRef} width="100%" viewBox={`0 0 ${totalW} ${CH}`} style={{ display: 'block', height: CH, userSelect: 'none' }}>
              <defs>
                <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#dcfce7" stopOpacity="0.7" />
                  <stop offset="40%" stopColor="#f1f5f9" stopOpacity="0.5" />
                  <stop offset="100%" stopColor="#fee2e2" stopOpacity="0.7" />
                </linearGradient>
              </defs>

              {/* Background zone bands */}
              <rect x={0} y={0} width={totalW} height={CH / 3} fill="#dcfce7" fillOpacity="0.35" />
              <rect x={0} y={CH / 3} width={totalW} height={CH / 3} fill="#f1f5f9" fillOpacity="0.45" />
              <rect x={0} y={CH * 2 / 3} width={totalW} height={CH / 3} fill="#fee2e2" fillOpacity="0.35" />

              {/* Zone labels on left */}
              <text x={4} y={POS_Y + 4} fontSize={9} fill="#18a558" fontWeight="700" opacity="0.7">😊</text>
              <text x={4} y={NEU_Y + 4} fontSize={9} fill="#64748b" fontWeight="700" opacity="0.7">😐</text>
              <text x={4} y={NEG_Y + 4} fontSize={9} fill="#e74c3c" fontWeight="700" opacity="0.7">😞</text>

              {/* Stage dividers */}
              {stages.map((_, i) => <line key={i} x1={stageX[i]} y1={0} x2={stageX[i]} y2={CH} stroke="#e2e8f0" strokeWidth="0.8" />)}

              {/* Zone separator lines */}
              <line x1={0} y1={CH / 3} x2={totalW} y2={CH / 3} stroke="#cbd5e1" strokeWidth="0.6" strokeDasharray="3 4" />
              <line x1={0} y1={CH * 2 / 3} x2={totalW} y2={CH * 2 / 3} stroke="#cbd5e1" strokeWidth="0.6" strokeDasharray="3 4" />

              {/* Filled area under curve */}
              {pts.length > 1 && <path
                d={smoothPath(pts) + ` L${pts[pts.length - 1].x},${NEU_Y} L${pts[0].x},${NEU_Y} Z`}
                fill="url(#sent-grad)" fillOpacity="0.18" stroke="none" />}

              {/* Smooth bezier curve */}
              <path d={smoothPath(pts)} fill="none" stroke="#334155" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" strokeOpacity="0.6" />

              {/* Dots with emoji labels */}
              {pts.map((p, i) => {
                const st = sentStateOf(p.v);
                const isTop = p.v === 1;
                return (
                  <g key={i} style={{ cursor: editMode && !p.isCap ? 'pointer' : 'default' }} onClick={editMode && !p.isCap ? () => cycleState(i) : undefined}>
                    {/* Glow ring */}
                    {!p.isCap && <circle cx={p.x} cy={p.y} r={editMode ? 14 : 11} fill={st.bg} stroke={st.color} strokeWidth="1.5" strokeOpacity="0.5" />}
                    {/* Emoji */}
                    {!p.isCap && <text x={p.x} y={p.y + 5} textAnchor="middle" fontSize={editMode ? 13 : 12} style={{ userSelect: 'none' }}>{st.emoji}</text>}
                    {/* Edit hint */}
                    {editMode && !p.isCap && <text x={p.x} y={isTop ? p.y - 17 : p.y + 24} textAnchor="middle" fontSize={7} fill={st.color} fontWeight="600" opacity="0.8">click</text>}
                  </g>
                );
              })}
            </svg>
          </td>
        </tr>
      );
    }

    /* ── CONNECTOR OVERLAY ── */
    /* ── CONNECTOR OVERLAY ── */
    function ConnectorOverlay({ stages, editMode, scrollRef, manualConnectors = [], draftConnector, lineStyle = 'orthogonal', onRemoveManualConnector }) {
      const [lines, setLines] = useState([]);
      const [manualLines, setManualLines] = useState([]);
      const [draftLine, setDraftLine] = useState(null);

      const connTypeMeta = type => CONN_TYPES.find(t => t.v === type) || CONN_TYPES[0];
      const resolveCardEl = useCallback((container, ref) => {
        if (!container || !ref) return null;
        return container.querySelector(`[data-step-id="${ref.sid}"][data-stage-id="${ref.stId}"][data-step-path="${ref.path}"]`);
      }, []);

      const getStepByRef = useCallback((ref) => {
        if (!ref) return null;
        const st = stages.find(s => s.id === ref.stId);
        if (!st) return null;
        let arr = [];
        if (ref.path === 'happy') {
          (st.happyFlow?.rows || []).forEach(r => { if (r.steps) arr.push(...r.steps); });
        } else if (ref.path === 'ex') arr = st.exceptions?.steps || [];
        else if (ref.path === 'help') arr = st.digitalHelp?.steps || [];
        else if (ref.path && ref.path.startsWith('lane:')) {
          const lid = ref.path.split(':')[1];
          (st.lanes?.[lid]?.rows || []).forEach(r => { if (r.steps) arr.push(...r.steps); });
        }
        return arr.find(s => s.id === ref.sid) || null;
      }, [stages]);

      const pointForSide = useCallback((rect, side, cr, container) => {
        const scrollLeft = container.scrollLeft;
        const scrollTop = container.scrollTop;
        switch (side) {
          case 'left':
            return { x: rect.left - cr.left + scrollLeft, y: rect.top + rect.height / 2 - cr.top + scrollTop };
          case 'top':
            return { x: rect.left + rect.width / 2 - cr.left + scrollLeft, y: rect.top - cr.top + scrollTop };
          case 'bottom':
            return { x: rect.left + rect.width / 2 - cr.left + scrollLeft, y: rect.bottom - cr.top + scrollTop };
          case 'right':
          default:
            return { x: rect.right - cr.left + scrollLeft, y: rect.top + rect.height / 2 - cr.top + scrollTop };
        }
      }, []);

      const offsetForSide = (pt, side, dist = 28) => {
        switch (side) {
          case 'left': return { x: pt.x - dist, y: pt.y };
          case 'right': return { x: pt.x + dist, y: pt.y };
          case 'top': return { x: pt.x, y: pt.y - dist };
          case 'bottom': return { x: pt.x, y: pt.y + dist };
          default: return { ...pt };
        }
      };

      const buildCurvedPath = (p1, side1, p2, side2) => {
        const isHorizontal = (side1 === 'left' || side1 === 'right') && (side2 === 'left' || side2 === 'right');
        const isVertical = (side1 === 'top' || side1 === 'bottom') && (side2 === 'top' || side2 === 'bottom');
        if (isHorizontal) {
          const dx = Math.max(Math.abs(p2.x - p1.x) * 0.4, 45);
          const c1x = side1 === 'left' ? p1.x - dx : p1.x + dx;
          const c2x = side2 === 'left' ? p2.x - dx : p2.x + dx;
          return `M${p1.x},${p1.y} C${c1x},${p1.y} ${c2x},${p2.y} ${p2.x},${p2.y}`;
        }
        if (isVertical) {
          const dy = Math.max(Math.abs(p2.y - p1.y) * 0.4, 45);
          const c1y = side1 === 'top' ? p1.y - dy : p1.y + dy;
          const c2y = side2 === 'top' ? p2.y - dy : p2.y + dy;
          return `M${p1.x},${p1.y} C${p1.x},${c1y} ${p2.x},${c2y} ${p2.x},${p2.y}`;
        }
        const dx = Math.max(Math.abs(p2.x - p1.x) * 0.28, 36);
        const dy = Math.max(Math.abs(p2.y - p1.y) * 0.28, 36);
        const c1x = side1 === 'left' ? p1.x - dx : side1 === 'right' ? p1.x + dx : p1.x;
        const c1y = side1 === 'top' ? p1.y - dy : side1 === 'bottom' ? p1.y + dy : p1.y;
        const c2x = side2 === 'left' ? p2.x - dx : side2 === 'right' ? p2.x + dx : p2.x;
        const c2y = side2 === 'top' ? p2.y - dy : side2 === 'bottom' ? p2.y + dy : p2.y;
        return `M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}`;
      };

      const buildOrthogonalPath = (p1, side1, p2, side2) => {
        const s = offsetForSide(p1, side1, 16);
        const t = offsetForSide(p2, side2, 16);
        const pts = [p1, s];
        const horizontalStart = side1 === 'left' || side1 === 'right';
        const horizontalEnd = side2 === 'left' || side2 === 'right';

        if (horizontalStart && horizontalEnd) {
          let midX;
          if (side1 === 'right' && side2 === 'left' && s.x <= t.x) midX = (s.x + t.x) / 2;
          else if (side1 === 'left' && side2 === 'right' && s.x >= t.x) midX = (s.x + t.x) / 2;
          else if (side1 === 'left' || side2 === 'left') midX = Math.min(s.x, t.x) - 34;
          else midX = Math.max(s.x, t.x) + 34;
          pts.push({ x: midX, y: s.y }, { x: midX, y: t.y });
        } else if (!horizontalStart && !horizontalEnd) {
          let midY;
          if (side1 === 'bottom' && side2 === 'top' && s.y <= t.y) midY = (s.y + t.y) / 2;
          else if (side1 === 'top' && side2 === 'bottom' && s.y >= t.y) midY = (s.y + t.y) / 2;
          else if (side1 === 'top' || side2 === 'top') midY = Math.min(s.y, t.y) - 30;
          else midY = Math.max(s.y, t.y) + 30;
          pts.push({ x: s.x, y: midY }, { x: t.x, y: midY });
        } else if (horizontalStart) {
          pts.push({ x: t.x, y: s.y });
        } else {
          pts.push({ x: s.x, y: t.y });
        }

        pts.push(t, p2);
        return pts.reduce((acc, pt, idx) => acc + `${idx === 0 ? 'M' : ' L'}${pt.x},${pt.y}`, '');
      };

      const buildPathByMode = (p1, side1, p2, side2, mode = lineStyle) => {
        if (mode === 'straight') return `M${p1.x},${p1.y} L${p2.x},${p2.y}`;
        if (mode === 'curved') return buildCurvedPath(p1, side1, p2, side2);
        return buildOrthogonalPath(p1, side1, p2, side2);
      };

      const measure = useCallback(() => {
        const container = scrollRef?.current;
        if (!container) return;

        const allSteps = [];
        stages.forEach(st => {
          const happySteps = [];
          (st.happyFlow?.rows || []).forEach(r => { if (r.steps) happySteps.push(...r.steps); });
          [...happySteps, ...(st.exceptions?.steps || []), ...(st.digitalHelp?.steps || []), ...(st.systems?.steps || [])].forEach(s => allSteps.push(s));
          Object.values(st.lanes || {}).forEach(l => {
            (l.rows || []).forEach(r => { if (r.steps) allSteps.push(...r.steps); });
          });
        });

        const cr = container.getBoundingClientRect();
        const manualIds = new Set((manualConnectors || []).map(c => c.id));
        const newLines = [];
        if (!editMode) {
          const pairCount = {};
          allSteps.forEach(step => {
            if (!step.number || (step.connects || []).length === 0) return;
            const srcEl = container.querySelector(`[data-step-num="${step.number}"]`);
            if (!srcEl) return;
            step.connects.forEach(conn => {
              if (manualIds.has(conn.id)) return;
              const tgtEl = container.querySelector(`[data-step-num="${conn.to}"]`);
              if (!tgtEl) return;
              const sr = srcEl.getBoundingClientRect();
              const tr = tgtEl.getBoundingClientRect();
              const goingRight = tr.left >= sr.right;
              const sx = (goingRight ? sr.right : sr.left) - cr.left + container.scrollLeft;
              const syBase = sr.top + sr.height / 2 - cr.top + container.scrollTop;
              const tx = (goingRight ? tr.left : tr.right) - cr.left + container.scrollLeft;
              const tyBase = tr.top + tr.height / 2 - cr.top + container.scrollTop;
              const sKey = `S${Math.round(syBase / 8)}`;
              const tKey = `T${Math.round(tyBase / 8)}`;
              pairCount[sKey] = (pairCount[sKey] || 0) + 1;
              pairCount[tKey] = (pairCount[tKey] || 0) + 1;
              const sOffset = (pairCount[sKey] - 1) * -11;
              const tOffset = (pairCount[tKey] - 1) * 11;
              const sy = syBase + sOffset;
              const ty = tyBase + tOffset;
              const side1 = goingRight ? 'right' : 'left';
              const side2 = goingRight ? 'left' : 'right';
              const meta = connTypeMeta(conn.type);
              newLines.push({
                id: conn.id,
                d: buildPathByMode({ x: sx, y: sy }, side1, { x: tx, y: ty }, side2, conn.style || lineStyle),
                label: conn.label,
                to: conn.to,
                type: conn.type,
                color: meta.c,
                sx, sy, tx, ty
              });
            });
          });
        }
        setLines(newLines);

        const measuredManual = manualConnectors.map(conn => {
          const fromEl = resolveCardEl(container, conn.from);
          const toEl = resolveCardEl(container, conn.to);
          if (!fromEl || !toEl) return null;
          const fromRect = fromEl.getBoundingClientRect();
          const toRect = toEl.getBoundingClientRect();
          const fromPt = pointForSide(fromRect, conn.from.side, cr, container);
          const toPt = pointForSide(toRect, conn.to.side, cr, container);
          const srcStep = getStepByRef(conn.from);
          const metaConn = (srcStep?.connects || []).find(c => c.id === conn.id) || { type: 'exception', style: lineStyle, label: '' };
          const meta = connTypeMeta(metaConn.type);
          return {
            id: conn.id,
            d: buildPathByMode(fromPt, conn.from.side, toPt, conn.to.side, metaConn.style || lineStyle),
            from: fromPt,
            to: toPt,
            label: metaConn.label,
            color: meta.c,
            type: metaConn.type,
            destNum: (getStepByRef(conn.to))?.number || ''
          };
        }).filter(Boolean);
        setManualLines(measuredManual);

        if (draftConnector?.from) {
          const fromEl = resolveCardEl(container, draftConnector.from);
          if (fromEl) {
            const fromRect = fromEl.getBoundingClientRect();
            const fromPt = pointForSide(fromRect, draftConnector.from.side, cr, container);
            const mouse = draftConnector.mouse || fromPt;
            const mouseSide = Math.abs(mouse.x - fromPt.x) > Math.abs(mouse.y - fromPt.y)
              ? (mouse.x >= fromPt.x ? 'right' : 'left')
              : (mouse.y >= fromPt.y ? 'bottom' : 'top');
            setDraftLine({ d: buildPathByMode(fromPt, draftConnector.from.side, mouse, mouseSide, draftConnector.style || lineStyle), color: connTypeMeta(draftConnector.type || 'exception').c });
          } else {
            setDraftLine(null);
          }
        } else {
          setDraftLine(null);
        }
      }, [stages, editMode, scrollRef, manualConnectors, draftConnector, resolveCardEl, pointForSide, lineStyle, getStepByRef]);

      useLayoutEffect(() => {
        measure();
        const id = setTimeout(measure, 120);
        window.addEventListener('resize', measure);
        window.addEventListener('beforeprint', measure);
        return () => {
          clearTimeout(id);
          window.removeEventListener('resize', measure);
          window.removeEventListener('beforeprint', measure);
        };
      }, [measure]);

      return (
        <svg className="conn-overlay"
          width={scrollRef?.current?.scrollWidth || '100%'}
          height={scrollRef?.current?.scrollHeight || '100%'}
          style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none', zIndex: 10 }}>
          <defs>
            <marker id="conn-arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M1 1L9 5L1 9" fill="none" stroke="currentColor"
                strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            </marker>
            <marker id="manual-arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M1 1L9 5L1 9Z" fill="currentColor" />
            </marker>
          </defs>

          {!editMode && lines.map((l, i) => {
            const midX = (l.sx + l.tx) / 2;
            const midY = (l.sy + l.ty) / 2 - 8;
            return (
              <g key={`semantic-${l.id || i}`} style={{ color: l.color }}>
                <path d={l.d} fill="none" stroke={l.color} strokeWidth="1.8"
                  strokeOpacity="0.88" strokeDasharray={(l.type === 'exception' || l.type === 'alternate') ? '4 3' : '0'}
                  markerEnd="url(#conn-arrow)" />
                {(l.label || l.to) && (
                  <>
                    <text x={midX} y={midY} textAnchor="middle" fontSize={7.5}
                      fill="#fff" fontWeight="600" stroke="#fff" strokeWidth="3"
                      strokeLinejoin="round" opacity="0.85">{l.to ? `→ ${l.to}${l.label ? ` · ${l.label}` : ''}` : l.label}</text>
                    <text x={midX} y={midY} textAnchor="middle" fontSize={7.5}
                      fill={l.color} fontWeight="700" opacity="0.95">{l.to ? `→ ${l.to}${l.label ? ` · ${l.label}` : ''}` : l.label}</text>
                  </>
                )}
              </g>
            );
          })}

          {manualLines.map((l) => {
            const midX = (l.from.x + l.to.x) / 2;
            const midY = (l.from.y + l.to.y) / 2 - 8;
            return (
              <g key={l.id} style={{ color: l.color }}>
                <path
                  d={l.d}
                  fill="none"
                  stroke={l.color}
                  strokeWidth="2"
                  strokeOpacity="0.96"
                  strokeDasharray={(l.type === 'exception' || l.type === 'alternate') ? '4 3' : '0'}
                  markerEnd="url(#manual-arrow)"
                  style={{ cursor: editMode ? 'pointer' : 'default', pointerEvents: editMode ? 'auto' : 'none' }}
                  onClick={(e) => {
                    e.stopPropagation();
                    if (editMode && onRemoveManualConnector && window.confirm('Remove this connector line?')) {
                      onRemoveManualConnector(l.id);
                    }
                  }}
                />
                {(l.label || l.destNum) && (
                  <>
                    <text x={midX} y={midY} textAnchor="middle" fontSize={7.5}
                      fill="#fff" fontWeight="600" stroke="#fff" strokeWidth="3"
                      strokeLinejoin="round" opacity="0.85">{l.destNum ? `→ ${l.destNum}${l.label ? ` · ${l.label}` : ''}` : l.label}</text>
                    <text x={midX} y={midY} textAnchor="middle" fontSize={7.5}
                      fill={l.color} fontWeight="700" opacity="0.95">{l.destNum ? `→ ${l.destNum}${l.label ? ` · ${l.label}` : ''}` : l.label}</text>
                  </>
                )}
              </g>
            );
          })}

          {editMode && draftLine && (
            <path d={draftLine.d} fill="none" stroke={draftLine.color || '#00A699'} strokeWidth="2" strokeDasharray="6 4" markerEnd="url(#manual-arrow)" />
          )}
        </svg>
      );
    }

    /* ── MAIN APP ── */
    function App() {
      const [data, setData] = useState(clone(INIT));
      const [editMode, setEditMode] = useState(false);
      const [modal, setModal] = useState(null);
      const [exporting, setExporting] = useState(false);
      const [showExportOverlay, setShowExportOverlay] = useState(false);
      const [isPrinting, setIsPrinting] = useState(false);
      const [restoreBanner, setRestoreBanner] = useState(false);
      const [restoredData, setRestoredData] = useState(null);
      const [popover, setPopover] = useState(null);
      const [showConnectors, setShowConnectors] = useState(true);
      const lineStyle = data.lineStyle || 'orthogonal';
      const [imagePreview, setImagePreview] = useState(null);
      const [draftConnector, setDraftConnector] = useState(null);
      const [isPanning, setIsPanning] = useState(false);
      const mapRef = useRef(null);
      const mapScrollRef = useRef(null);
      const panRef = useRef(null);
      const [fileHandle, setFileHandle] = useState(null);
      const [isSynced, setIsSynced] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [past, setPast] = useState([]);
      const [future, setFuture] = useState([]);

      useEffect(() => {
        const bp = () => setIsPrinting(true);
        const ap = () => setIsPrinting(false);
        window.addEventListener('beforeprint', bp);
        window.addEventListener('afterprint', ap);
        return () => {
          window.removeEventListener('beforeprint', bp);
          window.removeEventListener('afterprint', ap);
        };
      }, []);

      useEffect(() => {
        const debouncedSave = debounce(async () => {
          try {
            await Store.set('jmap:autosave', JSON.stringify(data));
          } catch (e) {
            console.error('Autosave failed:', e);
          }
        }, 1000);
        debouncedSave();
      }, [data]);

      const upd = (fn, skipHistory = false) => {
        setData(prev => {
          const n = clone(prev);
          fn(n);
          if (!skipHistory) {
            setPast(p => [prev, ...p].slice(0, 3));
            setFuture([]);
          }
          return n;
        });
      };

      const undo = () => {
        if (past.length === 0) return;
        const previous = past[0];
        const newPast = past.slice(1);
        setPast(newPast);
        setFuture(f => [data, ...f].slice(0, 3));
        setData(previous);
      };

      const redo = () => {
        if (future.length === 0) return;
        const next = future[0];
        const newFuture = future.slice(1);
        setFuture(newFuture);
        setPast(p => [data, ...p].slice(0, 3));
        setData(next);
      };

      const triggerSave = async () => {
        setIsSaving(true);
        try {
          await Store.set('jmap:autosave', JSON.stringify(data));
          const exportData = migrateData(data);
          const htmlContent = document.documentElement.outerHTML;
          const jsonComment = `<!-- EMBEDDED_JOURNEY_MAP_DATA:\n${JSON.stringify(exportData, null, 2)}\n:END_EMBEDDED_JOURNEY_MAP_DATA -->`;
          let newHtml = '';
          const regex = /<!-- EMBEDDED_JOURNEY_MAP_DATA:[\s\S]*?:END_EMBEDDED_JOURNEY_MAP_DATA -->/;
          if (regex.test(htmlContent)) newHtml = htmlContent.replace(regex, jsonComment);
          else newHtml = htmlContent.replace('</body>', `${jsonComment}\n</body>`);

          if (fileHandle) {
            const writable = await fileHandle.createWritable();
            await writable.write(newHtml);
            await writable.close();
            setIsSynced(true);
            setTimeout(() => setIsSynced(false), 2000);
          } else {
            // Standalone Fallback for Safari/Firefox
            doExport('html');
          }
        } catch (e) {
          console.error('Save failed:', e);
          alert('Save failed: ' + e.message);
        }
        setIsSaving(false);
      };

      // Auto-numbering effect
      useEffect(() => {
        if (!data.autoNumber) return;

        // Calculate expected sequence string to check if update is needed
        let expected = [];
        const toAlpha = (n) => { let res = ''; while (n >= 0) { res = String.fromCharCode((n % 26) + 65) + res; n = Math.floor(n / 26) - 1; } return res; };

        data.stages.forEach((st, sIdx) => {
          const phase = sIdx + 1;
          // Happy
          const happySteps = [];
          (st.happyFlow?.rows || []).forEach(r => { if (r.steps) happySteps.push(...r.steps); });
          const happyActive = happySteps.filter(s => !s.isDeleted);
          let hCount = 1;
          happySteps.forEach(s => {
            if (s.isDeleted) expected.push(`${s.id}:`);
            else if (happyActive.length === 1) expected.push(`${s.id}:${phase}`);
            else expected.push(`${s.id}:${phase}.${hCount++}`);
          });
          // Rest
          let alphaCount = 0;
          const rowsWithSteps = (data.rowOrder || []);
          rowsWithSteps.forEach(rowId => {
            let arr = [];
            if (rowId === 'ex') arr = st.exceptions?.steps;
            else if (rowId === 'help') arr = st.digitalHelp?.steps;
            else if (rowId === 'systems') arr = st.systems?.steps;
            else if (st.lanes && st.lanes[rowId]) {
              arr = [];
              (st.lanes[rowId].rows || []).forEach(r => { if (r.steps) arr.push(...r.steps); });
            }

            (arr || []).forEach(s => {
              if (s.isDeleted) expected.push(`${s.id}:`);
              else expected.push(`${s.id}:${phase}${toAlpha(alphaCount++)}`);
            });
          });
        });

        let current = [];
        data.stages.forEach(st => {
          const checkArr = arr => (arr || []).forEach(s => current.push(`${s.id}:${s.number || ''}`));
          const happySteps = [];
          (st.happyFlow?.rows || []).forEach(r => { if (r.steps) happySteps.push(...r.steps); });
          checkArr(happySteps);
          // Note: ensure order matches 'expected' (Happy -> rowOrder)
          const rowsWithSteps = (data.rowOrder || []);
          rowsWithSteps.forEach(rowId => {
            if (rowId === 'ex') checkArr(st.exceptions?.steps);
            else if (rowId === 'help') checkArr(st.digitalHelp?.steps);
            else if (rowId === 'systems') checkArr(st.systems?.steps);
            else if (st.lanes && st.lanes[rowId]) {
              const laneSteps = [];
              (st.lanes[rowId].rows || []).forEach(r => { if (r.steps) laneSteps.push(...r.steps); });
              checkArr(laneSteps);
            }
          });
        });

        if (JSON.stringify(expected) !== JSON.stringify(current)) {
          resequenceAllCards();
        }
      }, [data.stages, data.lanes, data.autoNumber, data.rowOrder]);

      useEffect(() => {
        if (!draftConnector?.from) return;
        const onMove = (e) => {
          const container = mapScrollRef.current;
          if (!container) return;
          const cr = container.getBoundingClientRect();
          setDraftConnector(prev => prev ? {
            ...prev,
            mouse: {
              x: e.clientX - cr.left + container.scrollLeft,
              y: e.clientY - cr.top + container.scrollTop
            }
          } : prev);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') setDraftConnector(null);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('keydown', onKey);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('keydown', onKey);
        };
      }, [draftConnector?.from]);

      useEffect(() => {
        (async () => {
          try {
            // 1. Try to find embedded data in the HTML itself (highest priority)
            const html = document.documentElement.outerHTML;
            const match = html.match(/<!-- EMBEDDED_JOURNEY_MAP_DATA:\n([\s\S]*?)\n:END_EMBEDDED_JOURNEY_MAP_DATA -->/);
            if (match && match[1]) {
              try {
                const embedded = JSON.parse(match[1]);
                if (embedded && embedded.title) {
                  setData(migrateData(embedded));
                  return; // Skip IndexedDB if we have fresh file data
                }
              } catch (e) { console.error('Embedded parse failed:', e); }
            }

            // 2. Fallback to localStorage autosave
            const r = await Store.get('jmap:autosave');
            if (r?.value) {
              const saved = JSON.parse(r.value);
              if (saved?.title) {
                setData(migrateData(saved));
              }
            }
          } catch (e) { console.error(e); }
        })();
      }, []);

      const linkFile = async () => {
        if (window.showOpenFilePicker) {
          try {
            const [handle] = await window.showOpenFilePicker({
              types: [{ description: 'Journey Map HTML', accept: { 'text/html': ['.html'] } }],
              multiple: false
            });
            setFileHandle(handle);
            // Initial trigger to confirm link
            const exportData = migrateData(data);
            const htmlContent = document.documentElement.outerHTML;
            const jsonComment = `<!-- EMBEDDED_JOURNEY_MAP_DATA:\n${JSON.stringify(exportData, null, 2)}\n:END_EMBEDDED_JOURNEY_MAP_DATA -->`;
            let newHtml = '';
            const regex = /<!-- EMBEDDED_JOURNEY_MAP_DATA:[\s\S]*?:END_EMBEDDED_JOURNEY_MAP_DATA -->/;
            if (regex.test(htmlContent)) newHtml = htmlContent.replace(regex, jsonComment);
            else newHtml = htmlContent.replace('</body>', `${jsonComment}\n</body>`);

            const writable = await handle.createWritable();
            await writable.write(newHtml);
            await writable.close();
            setIsSynced(true);
            setTimeout(() => setIsSynced(false), 2000);
          } catch (e) {
            if (e.name !== 'AbortError') alert('Failed to link file: ' + e.message);
          }
        } else {
          // Safari Fallback
          alert("Safari Mode: Your browser doesn't support direct file syncing. Use the 'Download Update' button to save your work to a new HTML file.");
        }
      };


      useEffect(() => {
        if (!isPanning) return;
        const onMove = (e) => {
          const el = mapScrollRef.current;
          const st = panRef.current;
          if (!el || !st) return;
          el.scrollLeft = st.left - (e.clientX - st.x);
          el.scrollTop = st.top - (e.clientY - st.y);
        };
        const stop = () => {
          panRef.current = null;
          setIsPanning(false);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', stop);
        window.addEventListener('mouseleave', stop);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', stop);
          window.removeEventListener('mouseleave', stop);
        };
      }, [isPanning]);

      /* ── 4: IMPORT — handles base64 images and full v2 structure ── */
      const migrateData = (raw) => {
        const dataCopy = JSON.parse(JSON.stringify(raw));
        if (dataCopy.defaultStageWidth === undefined) dataCopy.defaultStageWidth = 180;
        if (!dataCopy.printLayout) dataCopy.printLayout = 'A3 landscape';
        if (!Array.isArray(dataCopy.manualConnectors)) dataCopy.manualConnectors = [];
        if (!dataCopy.lineStyle) dataCopy.lineStyle = 'orthogonal';
        if (!dataCopy.fontSizes) dataCopy.fontSizes = {
          stepDesc: 11,
          stepSubDesc: 9.5,
          stageName: 10,
          laneLabel: 11,
          systemsText: 10.5,
        };
        if (!Array.isArray(dataCopy.lanes)) dataCopy.lanes = [];

        const cleanSteps = (steps) => {
          if (!Array.isArray(steps)) return;
          steps.forEach(step => {
            if ('tobeState' in step) delete step.tobeState;
            if (!('customBadge' in step)) step.customBadge = null;
            if (!Array.isArray(step.additionalDescriptions)) step.additionalDescriptions = step.subDesc ? [step.subDesc] : [];
            if (!Array.isArray(step.connects)) step.connects = [];
            if (typeof step.icon !== 'string') step.icon = '';
            if (typeof step.iconImage !== 'string') step.iconImage = '';

            if (!Array.isArray(step.keyFindings)) {
              const kf = String(step.keyFinding || '').trim();
              step.keyFindings = kf ? [kf] : [];
            } else {
              step.keyFindings = step.keyFindings.map(v => String(v || '').trim()).filter(Boolean);
            }

            if (!Array.isArray(step.customBadges)) {
              const b = step.customBadge;
              if (b && typeof b === 'object' && String(b.text || '').trim()) {
                step.customBadges = [{ text: String(b.text || '').trim(), color: String(b.color || '#3b82f6') }];
              } else {
                step.customBadges = [];
              }
            } else {
              step.customBadges = step.customBadges
                .filter(b => b && typeof b === 'object')
                .map(b => ({ text: String(b.text || '').trim(), color: String(b.color || '#3b82f6') }))
                .filter(b => b.text);
            }

            if (!Array.isArray(step.notifications)) step.notifications = [];
            step.notifications = step.notifications
              .filter(n => n && typeof n === 'object')
              .map(n => ({ icon: String(n.icon || '').trim(), text: String(n.text || '').trim() }))
              .filter(n => n.text && (n.icon === 'mobile' || n.icon === 'email' || n.icon === 'chat'));

            step.connects = step.connects.map(conn => ({
              id: conn.id || uid(),
              to: conn.to || '',
              type: conn.type === 'alternate' ? 'alternate' : 'exception',
              label: conn.label || '',
              style: ['straight', 'curved', 'orthogonal'].includes(conn.style) ? conn.style : 'orthogonal',
              ...(conn.toRef && typeof conn.toRef === 'object' ? { toRef: { sid: conn.toRef.sid || '', stId: conn.toRef.stId || '', path: conn.toRef.path || '' } } : {})
            }));
          });
        };

        if (Array.isArray(dataCopy.stages)) {
          dataCopy.stages.forEach(st => {
            if (!st.happyFlow) st.happyFlow = { rows: [{ id: uid(), name: 'Row 1', steps: [] }] };
            if (!Array.isArray(st.lanes)) st.lanes = [];

            if (!st.happyFlow.rows) {
              if (st.happyFlow.steps?.length > 0) {
                st.happyFlow.rows = [{ id: uid(), name: 'Row 1', steps: st.happyFlow.steps }];
              } else {
                st.happyFlow.rows = [{ id: uid(), name: 'Row 1', steps: [] }];
              }
            }
            st.happyFlow.rows.forEach(row => {
              if (!Array.isArray(row.steps)) row.steps = [];
              cleanSteps(row.steps);
            });

            st.lanes.forEach(row => {
              if (!Array.isArray(row.rows)) row.rows = [];
              row.rows.forEach(subRow => {
                if (!Array.isArray(subRow.steps)) subRow.steps = [];
                cleanSteps(subRow.steps);
              });
            });

            delete st._new;
            if (st.compliance && typeof st.compliance === 'object') {
              delete st.compliance._editing;
            }
          });
        }
        return dataCopy;
      };

      const doImport = (p) => {
        const migrated = migrateData(p);
        setData(migrated);
      };

      /* ── EXPORT ── */
      const doExport = async (fmt) => {
        if (fmt === 'json') {
          const exportData = migrateData(data);
          const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = `journey-map-${exportData.title.replace(/\s+/g, '-')}-${Date.now()}.json`;
          a.click();
          return;
        }

        if (fmt === 'html') {
          const exportData = migrateData(data);
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const htmlContent = document.documentElement.outerHTML;
          const jsonComment = `<!-- EMBEDDED_JOURNEY_MAP_DATA:\n${JSON.stringify(exportData, null, 2)}\n:END_EMBEDDED_JOURNEY_MAP_DATA -->`;
          const newHtml = htmlContent.replace('</body>', `${jsonComment}\n</body>`);
          doc.write(newHtml);
          doc.close();

          setTimeout(() => {
            const blob = new Blob([iframe.contentDocument.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `journey-map-${exportData.title.replace(/\s+/g, '-')}-${Date.now()}.html`;
            a.click();
            document.body.removeChild(iframe);
          }, 100);
          return;
        }

        if (fmt === 'pdf') {
          // Force-expand findings/notifications before the browser takes the print snapshot.
          setExporting(true);
          setShowExportOverlay(false);
          await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
          document.body.classList.add('exporting');
          try {
            window.print();
          } finally {
            setTimeout(() => {
              document.body.classList.remove('exporting');
              setExporting(false);
            }, 500);
          }
          return;
        }

        setExporting(true);
        setShowExportOverlay(true);
        /* Yield to React so the loading overlay paints before we block */
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        try {
          const el = mapRef.current;
          const tableEl = el.querySelector('.map-table');
          /* Calculate true content dimensions beyond the viewport */
          const W = Math.max(el.scrollWidth, tableEl ? tableEl.scrollWidth + 50 : 0);
          const H = el.scrollHeight;
          const name = data.title.replace(/\s+/g, '-');

          /* ── Collect all page CSS (already loaded, no external fetch needed) ── */
          let cssText = '';
          try {
            for (const ss of Array.from(document.styleSheets)) {
              try {
                for (const rule of Array.from(ss.cssRules)) {
                  /* Skip @font-face rules — use system font fallback instead */
                  if (rule.type === CSSRule.FONT_FACE_RULE) continue;
                  cssText += rule.cssText + '\n';
                }
              } catch (e) { /* cross-origin sheet — skip */ }
            }
          } catch (e) { }

          /* Add system-font override so text renders without Google Fonts */
          cssText += '\n* { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important; }\n';
          /* Ensure backgrounds render correctly inside foreignObject and force full expansion */
          cssText += '\nbody { background: #f0f4f9; margin: 0; width: ' + W + 'px; height: ' + H + 'px; }\n';
          cssText += '\n.map-card { background: #fff; width: ' + W + 'px !important; height: auto !important; overflow: visible !important; min-height: ' + H + 'px; }\n';
          cssText += '\n.map-scroll { overflow: visible !important; width: auto !important; height: auto !important; max-height: none !important; }\n';
          cssText += '\n.map-table { width: ' + (W - 40) + 'px !important; table-layout: fixed; }\n';

          /* ── Clone the map node ── */
          const cloned = el.cloneNode(true);
          cloned.classList.add('exporting');
          // Never include the progress overlay in exported assets.
          cloned.querySelectorAll('.load-overlay').forEach(n => n.remove());
          cloned.querySelectorAll('.no-print').forEach(n => n.remove());
          /* Ensure the clone has no max-height / overflow constraints */
          cloned.style.cssText = `width:${W}px; height:${H}px; overflow:visible; position:relative; background:#fff;`;

          /* ── Build a self-contained SVG with foreignObject ── */
          const svgNS = 'http://www.w3.org/2000/svg';
          const svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          svg.setAttribute('xmlns:xhtml', 'http://www.w3.org/1999/xhtml');
          svg.setAttribute('width', String(W));
          svg.setAttribute('height', String(H));
          svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

          /* White background */
          const bgRect = document.createElementNS(svgNS, 'rect');
          bgRect.setAttribute('width', String(W));
          bgRect.setAttribute('height', String(H));
          bgRect.setAttribute('fill', '#f0f4f9');
          svg.appendChild(bgRect);

          /* Inline stylesheet */
          const defs = document.createElementNS(svgNS, 'defs');
          const style = document.createElementNS(svgNS, 'style');
          style.textContent = cssText;
          defs.appendChild(style);
          svg.appendChild(defs);

          /* foreignObject containing the cloned HTML */
          const fo = document.createElementNS(svgNS, 'foreignObject');
          fo.setAttribute('x', '0');
          fo.setAttribute('y', '0');
          fo.setAttribute('width', String(W));
          fo.setAttribute('height', String(H));
          fo.appendChild(cloned);
          svg.appendChild(fo);

          /* Serialise */
          const svgStr = new XMLSerializer().serializeToString(svg);

          /* ── SVG export — done ── */
          if (fmt === 'svg') {
            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `journey-map-${name}-${Date.now()}.svg`;

            setShowExportOverlay(false);
            setExporting(false);
            return;
          }
        } catch (err) {
          console.error('Export failed:', err);
          alert('Export failed: ' + err.message);

        document.body.classList.remove('exporting');

      const calcStageWidth = (d, st) => {

      const resequenceAllCards = () => upd(d => {
        const toAlpha = (n) => { let res = ''; while (n >= 0) { res = String.fromCharCode((n % 26) + 65) + res; n = Math.floor(n / 26) - 1; } return res; };

      const parseCSV = (text) => {
        const rows = [];
        let currentField = '';
        let inQuotes = false;
        let currentRow = [];

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i + 1];

          if (char === '"' && inQuotes && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if ((char === '\r' || char === '\n') && !inQuotes) {
            currentRow.push(currentField.trim());
            if (currentRow.length > 0 && currentRow.some(f => f !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentField = '';
            if (char === '\r' && nextChar === '\n') i++;
          } else {
            currentField += char;
          }
        }
        return rows;
      };

      /* --- Update the handleImport function in ExportImportModal to handle CSV --- */

      const handleCSVImport = async (file) => {
        const text = await file.text();
        const rows = parseCSV(text);

        // Detect if it's "Main Details" or "Journey Details"
        const isMain = rows.some(r => r.includes("JOURNEY TITLE"));

        upd(d => {
          if (isMain) {
            // Mapping Main Details 
            rows.forEach(row => {
              if (row[1] === "JOURNEY TITLE") d.title = row[2];
              if (row[1] === "VERSION") d.version = row[2];
              if (row[1] === "DEFAULT JTBD") d.jtbd = row[2];
              // Persona Mapping
              if (row[1] === "Persona#1#LABEL") d.personas[0].name = row[2];
              if (row[1] === "Persona#1#JTBD") d.personas[0].jtbd = row[2];
            });
          } else {
            // Mapping Journey Details (Stages and Steps) 
            const stages = rows[0].slice(3).filter(Boolean); // Stage names are in row 1, col 4+
            d.stages = stages.map((name, idx) => {
              const colIdx = idx + 3;
              return {
                id: uid(),
                name: name,
                happyFlow: {
                  steps: [{
                    id: uid(),
                    number: rows[1][colIdx], // Card ID

                    additionalDescriptions: [
                      rows[3][colIdx], // Additional Details #1
                      rows[4][colIdx]  // Additional Details #2
                    ].filter(Boolean)
                  }]
                },
                // Map findings and friction from your template 
                keyFindings: [rows[8][colIdx], rows[9][colIdx]].filter(Boolean)
              };
            });
          }
        });
        onClose();
      };

                                        onFindingClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setPopover({ type: 'finding', data: { text: step.keyFinding, stepDesc: step.description.slice(0, 40), onEdit: () => setModal({ t: 'kf', step, path: 'happy', stId: st.id }) }, x: r.left, y: r.bottom + 6 }); }}
                                        path="happy" stId={st.id} onConnectorHandleClick={handleConnectorHandleClick}
