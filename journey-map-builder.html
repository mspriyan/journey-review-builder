                                    ))}
                                    {editMode && <button className="adddash" style={{ borderColor: 'var(--happy)', color: 'var(--happy)' }} onClick={() => setModal({ t: 'step', step: { _new: true }, path: 'happy', stId: st.id, rowId: row.id, title: 'Add Happy Flow Step', nextNum: getNextStepNumber(data) })}>＋ Add Step</button>}
                                  </div>
                                  {!editMode && row.steps.length === 0 && <span className="empty-dash">—</span>}
                                </div>
                              );
                            })}
                            {i < renderedStages.length - 1 && <div className="arrow-r">›</div>}
                          </td>
                        )
                      })}
                      {/* Happy Flow End */}
                    </tr>

                    {/* Sentiment row — fixed, but hideable */}
                    {!(rs.sentiment?.hidden) && <SentimentRow stages={renderedStages} data={data} editMode={editMode} rowSettings={rs.sentiment} onSentimentChange={setSentiment} onHide={() => toggleRowHidden('sentiment')} />}

                    {/* Custom lanes — user configurable */}
                    {editMode && data.lanes.length === 0 && (
                      <tr>
                        <td colSpan={renderedStages.length + 1} style={{ textAlign: 'center', padding: '12px', color: 'var(--muted)' }}>
                          <button className="btn btn-primary" onClick={() => setModal({ t: 'addrow', insertIndex: 0 })}>＋ Add Lane</button>
                        </td>
                      </tr>
                    )}
                    {data.lanes.map((row, ri) => {
                      if (row.hidden && !editMode) return null;
                      const isFirst = ri === 0; const isLast = ri === data.lanes.length - 1;
                      const reoBtn = id => editMode ? (<div className="lane-reorder"><button className="reo-btn" disabled={isFirst} onClick={() => { upd(d => { const idx = d.customRows.findIndex(r => r.id === id); if (idx > 0) [d.customRows[idx], d.customRows[idx - 1]] = [d.customRows[idx - 1], d.customRows[idx]]; }); }}>▲</button><button className="reo-btn" disabled={isLast} onClick={() => { upd(d => { const idx = d.customRows.findIndex(r => r.id === id); if (idx < d.customRows.length - 1) [d.customRows[idx], d.customRows[idx + 1]] = [d.customRows[idx + 1], d.customRows[idx]]; }); }}>▼</button></div>) : null;
                      return (
                        <tr key={row.id} style={{ borderBottom: `1px solid ${row.border}`, opacity: row.hidden ? .5 : 1 }}>
                          <td className="rl" style={{ background: row.bg, color: row.text, borderColor: row.border, position: 'relative' }}>
                            <span style={{ fontSize: 16 }}>{row.icon}</span><br />{row.label}
                            {editMode && <>{reoBtn(row.id)}<div style={{ display: 'flex', gap: 2, justifyContent: 'center', marginTop: 4, flexWrap: 'wrap' }}>
                              <button className="btn btn-xs" style={{ background: 'rgba(255,255,255,.7)', color: row.text, border: `1px solid ${row.border}` }} onClick={() => setModal({ t: 'editrow', row })}>✏️</button>
                              <button className="btn btn-xs" style={{ background: 'rgba(255,255,255,.7)', color: row.text, border: `1px solid ${row.border}` }} onClick={() => { upd(d => { const lane = d.lanes.find(l => l.id === row.id); if (lane) { if (!lane.rows) lane.rows = []; lane.rows.push({ id: uid(), name: `Row ${lane.rows.length + 1}`, steps: [] }); d.stages.forEach(st => { if (st.lanes?.[row.id]?.rows) st.lanes[row.id].rows.push({ id: uid(), name: `Row ${st.lanes[row.id].rows.length + 1}`, steps: [] }); }); } }); }}>➕</button>
                              <button className="btn btn-xs" style={{ background: 'rgba(231,76,60,.15)', color: '#c0392b', border: '1px solid #e74c3c' }} onClick={() => { upd(d => { d.lanes = d.lanes.filter(r => r.id !== row.id); }); }}>🗑</button>
                              <button className="btn btn-xs" style={{ background: 'rgba(255,255,255,.7)', color: row.hidden ? '#e74c3c' : row.text, border: `1px solid ${row.border}` }} onClick={() => { upd(d => { const r = d.lanes.find(x => x.id === row.id); if (r) r.hidden = !r.hidden; }); }}>{row.hidden ? '🙈' : '👁️'}</button>
                            </div></>}
                          </td>
                          {renderedStages.map((st, i) => {
                            if (st.isStart || st.isEnd) return <td key={st.id} className="sc" style={{ background: 'transparent', border: 'none' }}></td>;

                            const rows = stRow.rows || [];
                            return (
                              <td key={st.id} className="sc" style={{ background: row.bg + '44', ...getGapStyle(st, i, renderedStages) }} onDragOver={editMode ? e => e.preventDefault() : undefined} onDrop={editMode ? e => { e.preventDefault(); try { const d = JSON.parse(e.dataTransfer.getData('jmb/card')); if (d && d.sid) handleCardMove(d.path, d.stId, d.sid, d.rowId, `lane:${row.id}`, st.id, null, null); } catch (err) { } } : undefined}>
                                {rows.map(subRow => {
                                  const hasMultiple = subRow.steps.length > 1;
                                  return (
                                    <div key={subRow.id} style={{ marginBottom: rows.length > 1 ? '8px' : 0 }}>
                                      {rows.length > 1 && (
                                        <div style={{ fontSize: '9px', fontWeight: 700, color: row.text, marginBottom: '4px', display: 'flex', alignItems: 'center', gap: 3 }}>
                                          <span style={{ opacity: 0.7, cursor: editMode ? 'pointer' : 'default' }} title={editMode ? 'Click to rename' : ''} onClick={editMode ? () => { const n = window.prompt('Rename row:', subRow.name); if (n?.trim()) { const idx = rows.findIndex(r => r.id === subRow.id); upd(d => { const ln = d.lanes.find(l => l.id === row.id); if (ln?.rows?.[idx]) ln.rows[idx].name = n.trim(); d.stages.forEach(s => { if (s.lanes?.[row.id]?.rows?.[idx] != null) s.lanes[row.id].rows[idx].name = n.trim(); }); }); } } : undefined}>{subRow.name}</span>

                                            onDragStart={e => e.dataTransfer.setData('jmb/card', JSON.stringify({ sid: step.id, path: `lane:${row.id}`, stId: st.id, rowId: subRow.id }))}
                                            onEdit={() => setModal({ t: 'step', step, path: `lane:${row.id}`, stId: st.id, rowId: subRow.id, title: `Edit ${row.label} Step` })}
                                            onDelete={() => delStep(`lane:${row.id}`, st.id, step.id, subRow.id)}
                                            onDuplicate={editMode ? () => dupStep(`lane:${row.id}`, st.id, step.id, subRow.id) : null}
                                            onDropOnCard={editMode ? (fp, fst, fsid, fromRowId) => handleCardMove(fp, fst, fsid, fromRowId, `lane:${row.id}`, st.id, step.id, subRow.id) : null}
                                            onKeyFinding={editMode ? () => setModal({ t: 'kf', step, path: `lane:${row.id}`, stId: st.id }) : null}
                                            onFindingClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setPopover({ type: 'finding', data: { text: step.keyFinding, stepDesc: step.description.slice(0, 40), onEdit: () => setModal({ t: 'kf', step, path: `lane:${row.id}`, stId: st.id }) }, x: r.left, y: r.bottom + 6 }); }}
                                            path={`lane:${row.id}`} stId={st.id} onConnectorHandleClick={handleConnectorHandleClick}
                                            fontSizes={data.fontSizes}
                                          />
                                        ))}
                                        {editMode && <button className="adddash" style={{ borderColor: row.border, color: row.text }} onClick={() => setModal({ t: 'step', step: { _new: true }, path: `lane:${row.id}`, stId: st.id, rowId: subRow.id, title: `Add ${row.label} Step`, nextNum: getNextStepNumber(data) })}>＋ Add Step</button>}
                                      </div>
                                      {!editMode && subRow.steps.length === 0 && <span className="empty-dash">—</span>}
                                    </div>
                                  );
                                })}
                              </td>
                            );
                          })}
                        </tr>
                      );
                    }).flatMap((rowRender, ri) => {
                      if (!editMode) return [rowRender];
                      return [
                        rowRender,
                        <tr key={`insert-row-${ri}`} className="insert-lane-row">
                          <td colSpan={renderedStages.length + 1}>
                            <div className="insert-lane-cell">
                              <button className="btn btn-primary btn-xs insert-lane-btn no-print" onClick={() => setModal({ t: 'addrow', insertIndex: ri + 1 })}>＋</button>
                            </div>
                          </td>
                        </tr>
                      ];
                    })}
                  </tbody>
                </table>
                {showConnectors && <ConnectorOverlay stages={stages} editMode={editMode} scrollRef={mapScrollRef} manualConnectors={data.manualConnectors || []} draftConnector={draftConnector} lineStyle={lineStyle} onRemoveManualConnector={removeManualConnector} />}
              </div>

              {/* Hidden lanes bar */}
              {data.lanes.some(r => r.hidden) && <div className="hidden-lanes-bar">{data.lanes.filter(r => r.hidden).map(r => <span key={r.id} className="hidden-chip" style={{ borderColor: r.border, color: r.text }} onClick={() => { upd(d => { const row = d.lanes.find(x => x.id === r.id); if (row) row.hidden = false; }); }}>{r.icon} {r.label} ↑ Show</span>)}</div>}

              {/* Upcoming + Notes — split layout */}
              <div className="upcoming" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0, padding: 0 }}>
                {/* Left half: Upcoming Projects */}
                <div style={{ padding: '10px 18px 10px 22px', borderRight: '2px solid var(--border)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
                    <div style={{ fontSize: 9.5, fontWeight: 700, textTransform: 'uppercase', color: 'var(--muted)', letterSpacing: '.08em' }}>🚀 Upcoming Projects</div>
                    {editMode && <button className="btn btn-outline btn-sm" onClick={() => setModal({ t: 'projects' })}>Edit</button>}
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>{data.upcomingProjects.map((p, i) => <div key={i} className="project-chip"><span className="pnum">{i + 1}</span>{p}</div>)}</div>
                </div>
                {/* Right half: Additional Notes (rich text) */}
                <div style={{ padding: '10px 22px 10px 18px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
                    <div style={{ fontSize: 9.5, fontWeight: 700, textTransform: 'uppercase', color: 'var(--muted)', letterSpacing: '.08em' }}>📝 Additional Information</div>
                  </div>
                  {editMode
                    ? <RichTextEditor value={data.notes || ''} onChange={v => upd(d => { d.notes = v; })} placeholder="Add any additional notes, context, decisions, or constraints…" minHeight={80} />
                    : (data.notes && data.notes !== '<p></p>' && data.notes !== ''
                      ? <div className="notes-view" dangerouslySetInnerHTML={{ __html: data.notes }} />
                      : <span style={{ fontSize: 11, color: 'var(--muted)', fontStyle: 'italic' }}>No additional information added yet.</span>)
                  }
                </div>
              </div>

              {/* Links */}
              {((data.links?.length > 0) || editMode) && <div className="links-section">
                <div className="links-sec-title"><span>🔗 Artefact Links</span>{editMode && <button className="btn btn-outline btn-xs" onClick={() => setModal({ t: 'links' })}>Edit</button>}</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                  {(data.links || []).map(lk => <a key={lk.id} href={lk.url || '#'} target="_blank" rel="noopener noreferrer" className={`link-chip link-${lk.type}`}>{LINK_ICONS[lk.type] || '🔗'} {lk.label}</a>)}
                  {(data.links || []).length === 0 && editMode && <span style={{ fontSize: 11, color: 'var(--muted)' }}>No links yet — click Edit to add Figma, Jira, or Confluence references.</span>}
                </div>
              </div>}

            </div>
            <div style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 10, marginTop: 8, paddingBottom: 16 }} className="no-print">
              Journey Map Builder L4.3 · {editMode ? '✏️ Edit' : 'View'} · {stages.length} stages · {activePersona?.label}
            </div>
          </div>

          {/* MODALS */}
          {modal?.t === 'title' && <TitleModal data={data} onSave={p => { upd(d => { d.title = p.title; d.version = p.version; d.jobToBeDone = p.jobToBeDone; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'settings' && <SettingsModal data={data} showConnectors={showConnectors} onSave={(w, conn, playout, auto) => {
            upd(d => {
              d.defaultStageWidth = w;
              d.printLayout = playout;
              d.autoNumber = auto;
              if (auto) {
                // Trigger immediate re-sequence when enabling
                const toAlpha = (n) => { let res = ''; while (n >= 0) { res = String.fromCharCode((n % 26) + 65) + res; n = Math.floor(n / 26) - 1; } return res; };
                d.stages.forEach((st, sIdx) => {
                  const phase = sIdx + 1;
                  const happySteps = [];
                  (st.happyFlow?.rows || []).forEach(r => { if (r.steps) happySteps.push(...r.steps); });
                  const happyActive = happySteps.filter(s => !s.isDeleted);
                  let hCount = 1;
                  happySteps.forEach(s => {
                    if (s.isDeleted) s.number = '';
                    else if (happyActive.length === 1) s.number = String(phase);
                    else s.number = `${phase}.${hCount++}`;
                  });
                  let alphaCount = 0;
                  const rowsWithSteps = (d.rowOrder || []).filter(r => r !== 'systems');
                  rowsWithSteps.forEach(rowId => {
                    let arr = [];
                    if (rowId === 'ex') arr = st.exceptions?.steps;
                    else if (rowId === 'help') arr = st.digitalHelp?.steps;
                    else if (st.lanes && st.lanes[rowId]) {
                      arr = [];
                      (st.lanes[rowId].rows || []).forEach(r => { if (r.steps) arr.push(...r.steps); });
                    }
                    (arr || []).forEach(s => { if (s.isDeleted) s.number = ''; else s.number = `${phase}${toAlpha(alphaCount++)}`; });
                  });
                });
              }
            });
            setShowConnectors(conn);
            setModal(null);
          }} onResequence={resequenceAllCards} onClear={clearAllNumbers} onClose={() => setModal(null)} />}
          {modal?.t === 'fontsize' && <FontSizeModal fontSizes={data.fontSizes} onSave={fs => { upd(d => { d.fontSizes = fs; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'stagewidth' && <StageWidthModal stage={modal.st} defaultWidth={data.defaultStageWidth || DEFAULT_STAGE_WIDTH} onSave={w => { upd(d => { const s = d.stages.find(x => x.id === modal.st.id); if (s) { if (w == null) delete s.width; else s.width = w; } }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'stagename' && <StageNameModal stage={modal.st} onSave={n => { upd(d => { d.stages.find(s => s.id === modal.st.id).name = n; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'step' && <StepModal data={data} path={modal.path} stId={modal.stId} step={modal.step} modalTitle={modal.title} nextNum={modal.nextNum} onSave={(s) => saveStep(modal.path, modal.stId, s, modal.rowId)} onClose={() => setModal(null)} onResequence={resequenceAllCards} />}
          {modal?.t === 'compliance' && <ComplianceModal stage={modal.st} onSave={c => { upd(d => { d.stages.find(s => s.id === modal.st.id).compliance = c; }); setModal(null); }} onClose={() => setModal(null)} />}

          {modal?.t === 'projects' && <ProjModal projects={data.upcomingProjects} onSave={ps => { upd(d => { d.upcomingProjects = ps; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'links' && <LinksModal links={data.links || []} onSave={ls => { upd(d => { d.links = ls; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'editrow' && <CustomRowModal row={modal.row} onSave={row => { upd(d => { const r = d.lanes.find(x => x.id === modal.row.id); if (r) Object.assign(r, row); }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'addrow' && <CustomRowModal row={null} onSave={row => { upd(d => { if (!Array.isArray(d.lanes)) d.lanes = []; const newRow = { id: uid(), ...row, rows: [{ id: uid(), name: 'Row 1', steps: [] }] }; const insertIndex = modal.insertIndex ?? d.lanes.length; d.lanes.splice(insertIndex, 0, newRow); d.stages.forEach(s => { s.lanes = s.lanes || {}; s.lanes[newRow.id] = { rows: [{ id: uid(), name: 'Row 1', steps: [] }] }; }); }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'rowsettings' && <RowSettingsModal rowId={modal.rowId} settings={(data.rowSettings || DEFAULT_ROW_SETTINGS)[modal.rowId] || DEFAULT_ROW_SETTINGS[modal.rowId]} onSave={s => { upd(d => { if (!d.rowSettings) d.rowSettings = clone(DEFAULT_ROW_SETTINGS); d.rowSettings[modal.rowId] = { ...d.rowSettings[modal.rowId], ...s }; }); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'kf' && <KeyFindingModal step={modal.step} onSave={kf => { setStepKeyFinding(modal.path, modal.stId, modal.step.id, kf, modal.rowId); setModal(null); }} onClose={() => setModal(null)} />}
          {modal?.t === 'export' && <ExportImportModal onExport={doExport} onImportFile={doImport} onClose={() => setModal(null)} />}
          {modal?.t === 'reset' && <ConfirmModal message="Reset the journey map? All stages, activities, projects, notes, links and selections will be cleared." onConfirm={() => {
            upd(d => {
              /* Clear all stages */
              d.stages = [];
              /* Reset each persona's sentiment array */
              d.personas.forEach(p => { p.sentiment = []; });
              /* Clear upcoming projects, notes, links */
              d.upcomingProjects = [];
              d.notes = '';
              d.links = [];
              /* Clear job to be done on all personas */
              d.personas.forEach(p => { p.jtbd = ''; });
              d.jobToBeDone = '';
              /* Reset market selection — all off */
              Object.keys(d.markets).forEach(k => { d.markets[k] = false; });
            });
            setModal(null);
          }} onClose={() => setModal(null)} />}
          {modal?.t === 'persona' && <PersonaModal data={data} startAdding={modal.startAdding} onSelect={id => upd(d => { d.activePersona = id; })} onSave={(action, p) => { if (action === 'edit') upd(d => { const i = d.personas.findIndex(x => x.id === p.id); if (i >= 0) { d.personas[i].label = p.label; d.personas[i].description = p.description; d.personas[i].jtbd = p.jtbd; } }); else upd(d => { d.personas.push(p); }); setModal(null); }} onClose={() => setModal(null)} />}

          {imagePreview && (
            (() => {
              const ImagePreviewModal = () => {
                const [zoom, setZoom] = useState(1);
                const [panX, setPanX] = useState(0);
                const [panY, setPanY] = useState(0);
                const [isPanning, setIsPanning] = useState(false);
                const [panStart, setPanStart] = useState({ x: 0, y: 0 });
                const imgRef = useRef(null);
                const containerRef = useRef(null);

                const handleWheel = (e) => {
                  e.preventDefault();
                  const delta = e.deltaY > 0 ? 0.9 : 1.1;
                  setZoom(prev => Math.max(0.5, Math.min(5, prev * delta)));
                };

                const handleMouseDown = (e) => {
                  setIsPanning(true);
                  setPanStart({ x: e.clientX - panX, y: e.clientY - panY });
                };

                const handleMouseMove = (e) => {
                  if (!isPanning) return;
                  setPanX(e.clientX - panStart.x);
                  setPanY(e.clientY - panStart.y);
                };

                const handleMouseUp = () => {
                  setIsPanning(false);
                };

                useEffect(() => {
                  if (isPanning) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    return () => {
                      window.removeEventListener('mousemove', handleMouseMove);
                      window.removeEventListener('mouseup', handleMouseUp);
                    };
                  }
                }, [isPanning, panStart]);

                const resetView = () => {
                  setZoom(1);
                  setPanX(0);
                  setPanY(0);
                };

                const fitToScreen = () => {
                  if (!containerRef.current || !imgRef.current) return;
                  const containerWidth = containerRef.current.clientWidth;
                  const containerHeight = containerRef.current.clientHeight;
                  const imgWidth = imgRef.current.naturalWidth;
                  const imgHeight = imgRef.current.naturalHeight;

                  const scaleX = containerWidth / imgWidth;
                  const scaleY = containerHeight / imgHeight;
                  const scale = Math.min(scaleX, scaleY, 1);

                  setZoom(scale);
                  setPanX(0);
                  setPanY(0);
                };

                return (
                  <Modal title={`Image Preview — ${imagePreview.stageName || 'Stage'}`} onClose={() => setImagePreview(null)} wide>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10 }}>
                      <div style={{ fontSize: 12, color: 'var(--muted)', flex: 1 }}>
                        Zoom: {(zoom * 100).toFixed(0)}% | Scroll to zoom | Click & drag to pan
                      </div>
                      <button className="btn btn-xs btn-outline" onClick={() => setZoom(prev => Math.max(0.5, prev - 0.25))}>🔍−</button>
                      <button className="btn btn-xs btn-outline" onClick={() => setZoom(prev => Math.min(5, prev + 0.25))}>🔍+</button>
                      <button className="btn btn-xs btn-ghost" onClick={fitToScreen}>📐 Fit</button>
                      <button className="btn btn-xs btn-ghost" onClick={resetView}>↺ Reset</button>
                    </div>
                    <div
                      ref={containerRef}
                      className="image-preview-wrap"
                      style={{
                        cursor: isPanning ? 'grabbing' : 'grab',
                        overflow: 'hidden',
                        userSelect: 'none',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        /* Adjust height to fit within modal's max-height (92vh) and account for header, controls, and padding */
                        height: 'calc(92vh - 200px)'
                      }}
                      onWheel={handleWheel}
                      onMouseDown={handleMouseDown}
                    >
                      <img
                        ref={imgRef}
                        src={imagePreview.src}
                        alt="preview"
                        style={{
                          display: 'block',
                          maxWidth: '100%',
                          maxHeight: '100%',
                          transform: `scale(${zoom}) translate(${panX / zoom}px, ${panY / zoom}px)`,
                          transformOrigin: '0 0',
                          transition: isPanning ? 'none' : 'transform 0.1s ease',
                          pointerEvents: 'none',
                          objectFit: 'contain'
                        }}
                      />
                    </div>
                    <div className="mfooter">
                    </div>
                  </Modal>
                );
              };
              return <ImagePreviewModal />;
            })()
          )}

          {showExportOverlay && <div className="load-overlay"><div className="spinner" /><div className="load-text">Generating export…</div></div>}
          <Popover />
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      window.__JMB_BOOT && window.__JMB_BOOT.hide && window.__JMB_BOOT.hide();
    } catch (e) {
      window.__JMB_BOOT && window.__JMB_BOOT.showError && window.__JMB_BOOT.showError('Render failed', e && (e.stack || e.message || String(e)));
      throw e;
    }
  </script>
</body>

</html>
