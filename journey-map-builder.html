<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Map Builder</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #003b82;
      --primary2: #0055b3;
      --accent: #00A699;
      --happy: #18a558;
      --ex: #d9760c;
      --surface: #f0f4f9;
      --border: #d4dde9;
      --text: #1a2b3c;
      --muted: #6b7e92;
      --shadow: 0 4px 20px rgba(0, 59, 130, .10);
      --screen-w: 100px;
      --screen-h: 225px;
      --card-radius: 12px;
      --v1-header: #10b981;
      --v2-accent: #e91e63;
      --happy-green: #10b981;
      --card-bg: #ffffff;
      --pill-bg: #eff6ff;
      --pill-text: #1d4ed8;
      --footer-border: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100vh
    }

    /* Visible fallback if React/Babel fail to load or a runtime error occurs */
    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--surface);
      color: var(--text);
      z-index: 9999;
    }

    #boot-status .boot-card {
      width: min(720px, 100%);
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      line-height: 1.45;
    }

    #boot-status .boot-title {
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    #boot-status .boot-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 6px;
    }

    #boot-status code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes spinI {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(.97)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    /* TOOLBAR */
    .toolbar {
      background: #fff;
      border-bottom: 2px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shadow)
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0
    }

    .brand-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary)
    }

    .tb-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 1px;
      flex-shrink: 0
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 4px
    }

    /* Market */
    .market-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      background: #f8faff;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 3px 7px 3px 9px
    }

    .market-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-right: 2px;
      white-space: nowrap
    }

    .mkt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 20px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid;
      transition: all .18s;
      user-select: none;
      padding: 0 5px
    }

    .mkt-SG.on {
      background: #EF4444;
      color: #fff;
      border-color: #DC2626
    }

    .mkt-SG.off {
      background: #FEF2F2;
      color: #DC2626;
      border-color: #FECACA;
      opacity: .65
    }

    .mkt-MY.on {
      background: #F59E0B;
      color: #fff;
      border-color: #D97706
    }

    .mkt-MY.off {
      background: #FFFBEB;
      color: #D97706;
      border-color: #FDE68A;
      opacity: .65
    }

    .mkt-TH.on {
      background: #3B82F6;
      color: #fff;
      border-color: #2563EB
    }

    .mkt-TH.off {
      background: #EFF6FF;
      color: #2563EB;
      border-color: #BFDBFE;
      opacity: .65
    }

    .mkt-ID.on {
      background: #10B981;
      color: #fff;
      border-color: #059669
    }

    .mkt-ID.off {
      background: #ECFDF5;
      color: #059669;
      border-color: #A7F3D0;
      opacity: .65
    }

    /* BUTTONS */
    .btn {
      padding: 5px 11px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      transition: all .18s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-primary {
      background: var(--primary);
      color: #fff
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary2)
    }

    .btn-teal {
      background: var(--accent);
      color: #fff
    }

    .btn-teal:hover:not(:disabled) {
      filter: brightness(1.08)
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary)
    }

    .btn-outline:hover {
      background: #f0f5ff
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid var(--border)
    }

    .btn-ghost:hover {
      background: var(--surface);
      color: var(--text)
    }

    .btn-danger {
      background: #e74c3c;
      color: #fff
    }

    .btn-danger:hover {
      background: #c0392b
    }

    .btn-sm {
      padding: 3px 9px;
      font-size: 10px;
      border-radius: 6px
    }

    .btn-xs {
      padding: 2px 6px;
      font-size: 9px;
      border-radius: 5px
    }

    .edit-badge {
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 700
    }

    .lib-badge {
      background: #e74c3c;
      color: #fff;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 700;
      min-width: 16px;
      text-align: center
    }

    .spinI {
      display: inline-block;
      animation: spinI 1s linear infinite
    }

    /* MAP */
    .map-outer {
      padding: 14px 18px
    }

    .map-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeIn .3s ease
    }

    .map-header {
      background: linear-gradient(118deg, #002060 0%, #003b82 55%, #0055b3 100%);
      color: #fff;
      padding: 15px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px
    }

    .map-title-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2
    }

    .map-sub {
      font-size: 10px;
      opacity: .6;
      margin-top: 3px;
      font-weight: 500
    }

    .header-markets {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px
    }

    .hm-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 700;
      border: 1.5px solid rgba(255, 255, 255, .3);
      color: rgba(255, 255, 255, .7);
      background: rgba(255, 255, 255, .1)
    }

    .hm-badge.active {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .6);
      color: #fff
    }

    /* 2: JTBD bar — bigger label matching persona */
    .jtbd-bar {
      background: #ebf2ff;
      border-bottom: 2px solid var(--border);
      padding: 9px 22px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .jtbd-pill {
      font-size: 12px;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 7px;
      white-space: nowrap
    }

    .persona-jtbd-badge {
      font-size: 12px;
      font-weight: 700;
      background: #fff;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0
    }

    .persona-jtbd-badge:hover {
      background: #f0f5ff
    }

    .jtbd-text {
      font-size: 14px;
      color: #1a2b3c;
      flex: 1;
      font-weight: 500;
      line-height: 1.5
    }

    /* Legend */
    .legend-bar {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      padding: 7px 22px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-weight: 500
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%
    }

    .leg-bar {
      width: 4px;
      height: 12px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .leg-comp {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 3px;
      background: #fff7ed;
      border: 1px solid #f97316;
      color: #c2410c;
      font-size: 8.5px;
      font-weight: 700
    }

    .leg-finding {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 3px;
      background: #f0f9ff;
      border: 1px solid #38bdf8;
      color: #0369a1;
      font-size: 8.5px;
      font-weight: 700
    }

    /* Compliance/Finding popovers */
    .pop-overlay {
      position: fixed;
      inset: 0;
      z-index: 8999
    }

    .popover {
      position: fixed;
      background: #fff;
      border-radius: 10px;
      padding: 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .18);
      z-index: 9000;
      min-width: 250px;
      max-width: 300px;
      animation: fadeIn .15s ease;
      overflow: hidden;
      border: 1.5px solid
    }

    .popover-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px 9px;
      border-bottom: 1px solid;
      background: linear-gradient(to bottom, rgba(255, 255, 255, .5), rgba(248, 250, 252, .5))
    }

    .popover-title {
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      line-height: 1.3
    }

    .popover-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      line-height: 1;
      padding: 1px;
      border-radius: 3px;
      flex-shrink: 0
    }

    .popover-close:hover {
      color: var(--text)
    }

    .popover-body {
      padding: 10px 13px 12px
    }

    .popover-row {
      font-size: 10.5px;
      color: var(--text);
      margin-bottom: 5px;
      line-height: 1.55;
      display: flex;
      gap: 5px
    }

    .popover-row-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      flex-shrink: 0;
      padding-top: 2px
    }

    .popover-row-val {
      font-size: 10.5px;
      line-height: 1.55;
      color: var(--text)
    }

    .popover-note {
      font-size: 10px;
      color: #334155;
      margin-top: 8px;
      padding: 7px 9px;
      border-radius: 6px;
      line-height: 1.6;
      white-space: pre-wrap
    }

    /* Compliance variant */
    .pop-comp {
      border-color: #f97316
    }

    .pop-comp .popover-hdr {
      border-color: #fed7aa;
      background: #fff7ed
    }

    .pop-comp .popover-title {
      color: #c2410c
    }

    .pop-comp .popover-row-label {
      color: #c2410c
    }

    .pop-comp .popover-note {
      background: #fff7ed;
      border: 1px dashed #f97316
    }

    /* Finding variant */
    .pop-finding {
      border-color: #38bdf8
    }

    .pop-finding .popover-hdr {
      border-color: #bae6fd;
      background: #f0f9ff
    }

    .pop-finding .popover-title {
      color: #0369a1
    }

    .pop-finding .popover-row-label {
      color: #0369a1
    }

    .pop-finding .popover-note {
      background: #f0f9ff;
      border: 1px dashed #38bdf8
    }

    /* Compliance/Restore banners */
    .compliance-banner {
      background: #fff7ed;
      border-bottom: 1.5px solid #f97316;
      padding: 6px 22px;
      font-size: 11px;
      color: #7c2d12;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer
    }

    .compliance-banner:hover {
      background: #ffedd5
    }

    .restore-banner {
      background: #eff6ff;
      border-bottom: 2px solid #3b82f6;
      padding: 7px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: #1e40af;
      flex-wrap: wrap
    }

    /* Map scroll / table */
    .map-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      cursor: grab;
      user-select: none;
    }

    .map-scroll.is-panning {
      cursor: grabbing;
    }

    .map-table {
      border-collapse: separate;
      border-spacing: 8px 24px;
      width: 100%
    }

    .map-table td,
    .map-table th {
      border: none
    }

    .rl {
      padding: 7px 5px;
      text-align: center;
      vertical-align: middle;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      line-height: 1.5;
      border-right: 2px solid;
      min-width: 105px;
      width: 105px;
      word-break: keep-all;
      position: relative
    }

    .rl-stage {
      background: #ebf2ff;
      color: var(--primary);
      border-color: var(--primary2)
    }

    .rl-screen {
      background: #f5f5f5;
      color: #777;
      border-color: #ccc
    }

    .rl-happy {
      background: #edf9f3;
      color: #146b38;
      border-color: var(--happy)
    }

    .stage-th {
      position: relative;
      overflow: visible;
      background: var(--primary);
      color: #fff;
      padding: 9px 7px;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .07em;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, .15);
      vertical-align: top;
      min-width: 100px
    }

    .width-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 166, 153, .25);
      border: 1px solid rgba(0, 166, 153, .6);
      color: #a7f3ed;
      border-radius: 4px;
      font-size: 7px;
      font-weight: 700;
      padding: 1px 4px;
      margin-top: 2px;
      letter-spacing: .04em
    }

    .stage-num-badge {
      width: 18px;
      height: 18px;
      background: rgba(255, 255, 255, .18);
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px
    }

    .comp-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #fff7ed;
      border: 1px solid #f97316;
      color: #c2410c;
      border-radius: 4px;
      font-size: 7.5px;
      font-weight: 700;
      padding: 1px 5px;
      margin-top: 3px;
      cursor: pointer;
      user-select: none
    }

    .comp-badge:hover {
      background: #ffedd5
    }

    .sc {
      border-right: 1px solid var(--border);
      vertical-align: top;
      padding: 7px;
      min-width: 160px;
      position: relative
    }

    .sc-cards-horizontal {
      display: flex;
      flex-direction: row;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: flex-start;
    }

    .sc-cards-horizontal .step-card {
      flex-shrink: 0;
      margin-bottom: 0;
    }

    .sc-cards-single {
      display: flex;
      flex-direction: column;
    }

    .sc-cards-single .step-card {
      max-width: 240px;
    }

    .sc-happy {
      background: #edf9f3
    }

    .sc-screen {
      background: #fafafa;
      text-align: center;
      vertical-align: middle;
      padding: 8px 5px
    }

    /* STEP CARDS */
    .step-card {
      background: #fff;
      border-radius: 9px;
      padding: 8px 9px 6px;
      margin-bottom: 6px;
      position: relative;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07)
    }

    .step-card:last-child {
      margin-bottom: 0
    }

    .step-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      margin-left: 28px;
      flex-wrap: wrap;
    }

    .step-num-ring {
      position: absolute;
      top: 8px;
      left: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid;
      background: #fff;
      font-size: 9px;
      font-weight: 800;
      flex-shrink: 0;
      padding: 0 2px;
      line-height: 1
    }

    .step-emo {
      font-size: 15px;
      flex-shrink: 0;
      margin-left: auto
    }

    .step-desc {
      font-size: 11px;
      color: #2c3e50;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .step-subdesc {
      font-size: 9.5px;
      color: #6b7e92;
      line-height: 1.4;
      margin-top: 2px;
      font-style: italic;
      border-top: 1px dashed #e8edf2;
      padding-top: 2px;
      white-space: pre-wrap;
    }

    /* Friction / Alternate */
    .step-card.is-friction {
      border-left: 3px solid #F97316 !important
    }

    .step-card.is-alternate {
      border-left: 3px solid #3B82F6 !important
    }

    .happy-card.is-friction {
      border-left: 3px solid #F97316 !important
    }

    .happy-card.is-alternate {
      border-left: 3px solid #3B82F6 !important
    }

    .step-indicator {
      position: absolute;
      top: 4px;
      right: 20px;
      font-size: 11px;
      line-height: 1;
      pointer-events: none
    }

    /* To-be state on steps */
    .step-connects {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 4px;
      padding-top: 3px;
      border-top: 1px dashed #e8edf2
    }

    .conn-chip {
      display: inline-flex;
      align-items: center;
      font-size: 8px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 10px;
      border: 1px solid;
      cursor: default
    }

    .custom-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 8px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      margin-top: 3px;
      margin-bottom: 1px;
      color: #fff;
      cursor: help;
    }

    .custom-badge-creator {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed #e8edf2;
    }

    /* 5b: Card Deleted State — new */
    .card-deleted {
      opacity: 0.65;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 0, 0, 0.02) 10px, rgba(0, 0, 0, 0.02) 20px);
    }

    .is-deleted {
      /* Visually indicated by Deleted badge and opacity; no strike-through */
      text-decoration: none;
    }

    .del-badge {
      position: absolute;
      top: 0px;
      right: 0px;
      background: #ef4444;
      color: #fff;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 0 0 0 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      z-index: 20;
      pointer-events: none;
      box-shadow: -1px 1px 3px rgba(0, 0, 0, 0.15);
    }


    /* 6: Key finding badge */
    .kf-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: #0369a1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      cursor: pointer;
      transition: transform .15s;
      z-index: 5;
      color: #fff;
      border: 1.5px solid #38bdf8
    }

    .kf-badge:hover {
      transform: scale(1.2)
    }

    .kf-capture-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 8.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1.5px dashed #38bdf8;
      background: #f0f9ff;
      color: #0369a1;
      cursor: pointer;
      margin-top: 5px;
      transition: all .15s
    }

    .kf-capture-btn:hover {
      background: #e0f2fe
    }

    /* Happy flow */
    .happy-card {
      background: #fff;
      border: 2px solid var(--happy);
      border-radius: 10px;
      padding: 8px 10px 6px;
      position: relative;
      box-shadow: 0 2px 8px rgba(24, 165, 88, .1)
    }

    .hnum {
      position: absolute;
      top: -11px;
      left: 9px;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--happy);
      background: var(--happy);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2px
    }

    .htext {
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 11px;
      color: #2c3e50;
      font-weight: 700
    }

    .htext.has-num {
      margin-top: 5px
    }

    .hsubdesc {
      font-size: 9.5px;
      color: #6b7e92;
      line-height: 1.4;
      margin-top: 2px;
      font-style: italic;
      font-weight: 400;
      border-top: 1px dashed rgba(24, 165, 88, .25);
      padding-top: 2px;
      white-space: pre-wrap;
    }

    .arrow-r {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      color: var(--happy);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none
    }

    .ea {
      display: flex;
      gap: 3px;
      margin-top: 5px
    }

    .cedit {
      flex: 1;
      background: none;
      border: 1px solid;
      border-radius: 4px;
      padding: 2px 0;
      cursor: pointer;
      font-size: 9.5px;
      font-family: inherit;
      font-weight: 600;
      transition: all .15s
    }

    .adddash {
      width: 100%;
      background: none;
      border: 1.5px dashed;
      border-radius: 7px;
      padding: 4px 0;
      cursor: pointer;
      font-size: 10.5px;
      font-family: inherit;
      font-weight: 600;
      transition: all .2s;
      margin-top: 3px
    }

    .empty-dash {
      color: #ccc;
      font-size: 16px;
      text-align: center;
      padding: 5px 0;
      display: block
    }

    /* Screens */
    .thumbs {
      display: flex;
      gap: 5px;
      justify-content: center;
      padding: 3px 0
    }

    .thumb {
      width: var(--screen-w);
      height: var(--screen-h);
      background: #fff;
      border: 1.5px dashed #cbd5e0;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      transition: all .2s;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      padding: 0
    }

    .thumb:hover {
      border-color: var(--primary);
      background: #f0f5ff
    }

    .thumb img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: none;
      display: block;
      border-radius: 10px;
      pointer-events: none
    }

    .thumb-hint {
      font-size: 7px;
      color: #bbb;
      margin-top: 2px;
      text-align: center
    }

    .thumb-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.95))
    }

    .thumb-inner.center-top {
      align-items: center;
      justify-content: flex-start;
    }

    .thumb-toolbar {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap
    }

    .img-action-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .img-action-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f8fbff
    }

    .screen-drop-target {
      min-height: calc(var(--screen-h) + 42px);
    }

    /* --- NEW V1/V2 CARD STYLES --- */
    .card-v1,
    .card-v2 {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1.5px solid var(--happy-green);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      margin-bottom: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-v1:hover,
    .card-v2:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* Refined Header */
    .c-header {
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .c-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .c-step-box {
      background: var(--happy-green);
      color: #fff;
      font-size: 10px;
      /* ~25% smaller */
      font-weight: 800;
      min-width: 24px;
      /* ~25% smaller */
      height: 24px;
      /* ~25% smaller */
      padding: 0 4px;
      /* allow 2-3 char step numbers (e.g. 8B) */
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .c-step-box.outlined {
      background: transparent !important;
      border: 2px solid currentColor;
      color: inherit;
    }

    .c-icons {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .c-title-area {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }

    .c-lock-icon {
      width: 28px;
      height: 28px;
      color: #94a3b8;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .c-lock-icon-emoji,
    .c-lock-icon-img {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .c-lock-icon-emoji {
      font-size: 20px;
      line-height: 1;
    }

    .c-lock-icon-img {
      object-fit: contain;
    }

    .c-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--happy-green);
      line-height: 1.25;
      margin: 0;
      flex: 1;
      min-width: 0;
      /* allow the text to use full flex width before wrapping */
    }

    .c-divider {
      height: 2px;
      background: var(--happy-green);
      margin: 4px 16px 0;
      opacity: 0.6;
    }

    /* Common Card Content */
    .c-body {
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .c-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .c-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .c-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 6px;
    }

    .preview-mode .c-list {
      gap: 7px;
    }

    .c-list-item {
      display: flex;
      gap: 14px;
      font-size: 12px;
      font-weight: 400;
      /* Removed bold */
      color: #4a5568;
      line-height: 1.4;
      align-items: flex-start;
    }

    .c-list-item-num {
      width: 20px;
      /* ~25% smaller */
      height: 20px;
      /* ~25% smaller */
      border: 1px solid #cbd5e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8.5px;
      /* ~25% smaller */
      font-weight: 500;
      flex-shrink: 0;
      color: #718096;
    }

    /* Expansion Area */
    .c-expansion {
      border-top: 1px dashed #cbd5e0;
      padding: 0;
      background: #fff;
    }

    .c-section {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .c-section:not(:last-child) {
      border-bottom: 1px dashed #cbd5e0;
    }

    .c-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .c-section-title {
      font-size: 11px;
      font-weight: 800;
      color: #3182ce;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .c-section-text {
      font-size: 11.5px;
      font-weight: 400;
      /* Removed bold */
      color: #1a202c;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .c-collapse-btn {
      width: 18px;
      height: 18px;
      border: 1px solid #cbd5e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #718096;
      font-size: 12px;
      transition: all 0.2s;
    }

    .c-collapse-btn:hover {
      background: #f7fafc;
      border-color: #a0aec0;
    }

    /* New Footer */
    .c-footer {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .c-footer-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .c-footer-trigger:hover {
      opacity: 0.7;
    }

    .c-finding-count {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #1a202c;
    }

    .c-finding-icon {
      width: 16px;
      height: 16px;
      color: #a855f7;
      /* Purple icon */
    }

    .c-bell-icon {
      width: 20px;
      height: 20px;
      color: #3b82f6;
    }

    /* Auto-expansion for Print/Export */
    @media print {
      .c-expansion {
        display: block !important;
      }

      .c-footer {
        display: none !important;
      }

      .card-v1,
      .card-v2 {
        break-inside: avoid;
      }
    }

    .exporting .c-expansion {
      display: block !important;
    }

    .exporting .c-footer {
      display: none !important;
    }

    .step-meta-chip {
      min-height: 20px;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
      white-space: nowrap;
    }

    .step-meta-chip.icon-only {
      min-width: 20px;
      padding: 1px 5px;
    }

    .step-badge-chip {
      color: #fff;
      border: none;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .additional-list {
      margin-top: 2px;
      padding-top: 2px;
      border-top: 1px dashed #e8edf2;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .additional-item {
      display: flex;
      gap: 3px;
      align-items: flex-start;
      font-size: 9.5px;
      color: #6b7e92;
      line-height: 1.45;
    }

    .additional-item>div {
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .additional-item-num {
      font-weight: 800;
      color: var(--primary);
      min-width: 18px;
      flex-shrink: 0;
    }

    .connector-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
      box-shadow: 0 1px 4px rgba(0, 59, 130, .18);
      cursor: crosshair;
      z-index: 12;
      opacity: .95;
    }

    .connector-handle:hover {
      transform: scale(1.08);
      background: #ebf2ff;
    }

    .connector-handle-top {
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .connector-handle-right {
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .connector-handle-bottom {
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .connector-handle-left {
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .insert-stage-btn {
      position: absolute;
      top: 50%;
      right: -35px;
      transform: translateY(-50%);
      z-index: 15;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .15);
      font-size: 16px;
    }

    .insert-lane-row td {
      padding: 0 !important;
      border: none !important;
      background: transparent !important;
    }

    .insert-lane-cell {
      height: 34px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insert-lane-btn {
      position: absolute;
      left: 2.5%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      z-index: 15;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
      font-size: 16px;
    }

    .insert-lane-cell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px dashed rgba(107, 126, 146, .45);
      transform: translateY(-50%);
    }

    .preview-mode .width-badge,
    .exporting .width-badge {
      display: none !important;
    }

    .image-preview-wrap {
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }


    .image-preview-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 200px);
      object-fit: contain;
    }

    .image-preview-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }


    .empty-ico {
      font-size: 20px;
      opacity: .2
    }

    /* Reorder */
    .lane-reorder {
      display: flex;
      flex-direction: column;
      gap: 1px;
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%)
    }

    .reo-btn {
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(0, 0, 0, .12);
      border-radius: 3px;
      cursor: pointer;
      font-size: 8px;
      line-height: 1;
      padding: 1px 3px;
      color: #555
    }

    .reo-btn:hover {
      background: #fff;
      color: var(--primary)
    }

    .reo-btn:disabled {
      opacity: .25;
      cursor: default
    }

    /* Hidden lanes */
    .hidden-lanes-bar {
      padding: 5px 22px;
      background: #f1f5f9;
      border-top: 1px dashed #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 10px;
      color: var(--muted)
    }

    .hidden-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      transition: all .15s
    }

    .hidden-chip:hover {
      border-color: var(--primary);
      color: var(--primary)
    }

    /* Upcoming / Links */
    .upcoming {
      padding: 10px 22px;
      background: #fafafa;
      border-top: 2px solid var(--border)
    }

    .project-chip {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 11.5px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .05)
    }

    .pnum {
      width: 18px;
      height: 18px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0
    }

    .links-section {
      padding: 10px 22px 12px;
      background: #f8faff;
      border-top: 1px solid var(--border)
    }

    .links-sec-title {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      transition: all .15s;
      cursor: pointer;
      margin: 2px
    }

    .link-chip:hover,
    .link-chip:focus {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0f5ff
    }

    .link-figma {
      border-color: #9333ea;
      color: #7c3aed
    }

    .link-figma:hover {
      background: #faf5ff
    }

    .link-jira {
      border-color: #2563eb;
      color: #1d4ed8
    }

    .link-jira:hover {
      background: #eff6ff
    }

    .link-confluence {
      border-color: #0891b2;
      color: #0e7490
    }

    .link-confluence:hover {
      background: #ecfeff
    }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease
    }

    .modal-box {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .3);
      animation: slideIn .2s ease
    }

    .modal-box.wide {
      max-width: 900px;
      width: 90vw;
    }

    .modal-box.xl {
      max-width: 1250px;
      width: 96vw;
    }

    .mhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 9px;
      border-bottom: 2px solid var(--border)
    }

    .mtitle {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary)
    }

    .mclose {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--muted);
      line-height: 1;
      padding: 2px;
      border-radius: 4px
    }

    .fg {
      margin-bottom: 11px
    }

    .flabel {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .finput {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      transition: border .2s;
      background: #fff;
      resize: vertical
    }

    .finput:focus {
      outline: none;
      border-color: var(--primary2);
      box-shadow: 0 0 0 3px rgba(0, 85, 179, .08)
    }

    .mfooter {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      margin-top: 16px;
      padding-top: 11px;
      border-top: 1px solid var(--border)
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      padding: 7px 9px;

<body>
  <div id="boot-status">
    <div class="boot-card">
      <div class="boot-title">Loading Journey Map Builder…</div>
      <div>If you see this for more than a second, open DevTools Console to check errors. This file also needs internet
        access to load React/Babel from CDN.</div>
      <div class="boot-sub">Tip: If your environment blocks remote scripts, serve this folder via a local web server
        instead of opening with <code>file://</code>.</div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      const el = document.getElementById('boot-status');
      if (!el) return;

      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function showError(title, details) {
        const d = details ? `<pre style="margin:10px 0 0; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; overflow:auto; max-height:40vh;"><code>${esc(details)}</code></pre>` : '';
        el.innerHTML = `
          <div class="boot-card">
            <div class="boot-title">${esc(title || 'Error')}</div>
            <div style="color:#b91c1c; font-weight:700;">The app failed to start.</div>
            ${d}
            <div class="boot-sub">Open DevTools Console for the full stack trace.</div>
          </div>
        `;
        el.style.display = 'flex';
      }

      window.__JMB_BOOT = {
        hide: () => { el.style.display = 'none'; },
        showError
      };

      window.addEventListener('error', (e) => {
        try {
          const msg = e?.error?.stack || e?.message || String(e);
          showError('Runtime error', msg);
        } catch { /* ignore */ }
      });

      window.addEventListener('unhandledrejection', (e) => {
        try {
          const msg = e?.reason?.stack || e?.reason?.message || String(e?.reason || e);
          showError('Unhandled promise rejection', msg);
        } catch { /* ignore */ }
      });

      // If CDN scripts are blocked, Babel/React never load and the text/babel block won’t execute.
      setTimeout(() => {
        if (!window.React || !window.ReactDOM || !window.Babel) {
          showError(
            'CDN scripts not available',
            `Missing globals:\n` +
            `${!window.React ? '• React\n' : ''}` +
            `${!window.ReactDOM ? '• ReactDOM\n' : ''}` +
            `${!window.Babel ? '• Babel\n' : ''}` +
            `\nThis file loads dependencies from CDN. Ensure internet access or serve with a local bundler.`
          );
        }
      }, 1400);
    })();
  </script>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useLayoutEffect } = React;

    const MARKET_CFG = { SG: { label: 'SG' }, MY: { label: 'MY' }, TH: { label: 'TH' }, ID: { label: 'ID' } };
    const LANE_ICONS = ['📱', '🌐', '🏛️', '💬', '📧', '📞', '🤝', '🏧', '💻', '🛎️', '📝', '🔔', '🏪', '🤳', '📟', '🖥️', '📲', '🏦', '🔁', '🎯'];
    const LANE_COLORS = [
      { bg: '#ebf2ff', border: '#0055b3', text: '#003b82' }, { bg: '#e8f8f5', border: '#00A699', text: '#0c6d5a' },
      { bg: '#f3eefb', border: '#8e44ad', text: '#5b2c8d' }, { bg: '#fff7ed', border: '#d9760c', text: '#7d3a00' },
      { bg: '#fef9c3', border: '#ca8a04', text: '#713f12' }, { bg: '#f0fdf4', border: '#16a34a', text: '#14532d' },
      { bg: '#fdf2f8', border: '#db2777', text: '#831843' }, { bg: '#f1f5f9', border: '#475569', text: '#1e293b' },
    ];
    const EMOTIONS = ['', '😤', '😟', '🔒', '⚠️', '❌', '🛡️', '🔄', '📵', '💬', '🚫', '😊', '✅', '🎯', '⏳', '💡', '🔥', '🏆', '😰', '🤔'];
    const CONN_TYPES = [
      { v: 'exception', l: 'Exception Flow', c: '#e74c3c' },
      { v: 'alternate', l: 'Alternate Flow', c: '#3B82F6' },
    ];
    const LINE_STYLE_OPTIONS = [
      { v: 'straight', l: 'Straight' },
      { v: 'curved', l: 'Bend' },
      { v: 'orthogonal', l: 'Right-angle' }
    ];
    const uid = () => Math.random().toString(36).slice(2, 9);
    const clone = v => JSON.parse(JSON.stringify(v));
    const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

    const makeStep = (num = '', desc = '', opts = {}) => {
      const step = {
        id: uid(), number: num, description: desc,
        subDesc: opts.subDesc || '',
        additionalDescriptions: Array.isArray(opts.additionalDescriptions)
          ? opts.additionalDescriptions.filter(Boolean)
          : (opts.subDesc ? [opts.subDesc] : []),
        emotion: opts.emotion || '',
        isFriction: !!opts.isFriction, isAlternate: !!opts.isAlternate,
        connects: opts.connects || [],
        isDeleted: !!opts.isDeleted,
        icon: opts.icon || '',
        iconImage: opts.iconImage || '',
      };

      // Multi-item Support with Migration
      step.keyFindings = Array.isArray(opts.keyFindings)
        ? opts.keyFindings
        : (opts.keyFinding ? [opts.keyFinding] : []);

      step.customBadges = Array.isArray(opts.customBadges)
        ? opts.customBadges
        : (opts.customBadge ? [opts.customBadge] : []);

      step.notifications = Array.isArray(opts.notifications)
        ? opts.notifications
        : [];

      return step;
    };

    const getAdditionalDescriptions = (step) => {
      if (Array.isArray(step?.additionalDescriptions) && step.additionalDescriptions.length) {
        return step.additionalDescriptions.filter(v => (v || '').trim());
      }
      if (step?.subDesc && String(step.subDesc).trim()) return [String(step.subDesc)];
      return [];
    };

    /** Parse [[color:text]] and convert to span with style, and handle line breaks */
    const renderStepText = (text) => {
      if (!text) return '';
      // Support [[color:text]] or [[#hex:text]]
      let html = text.replace(/\[\[(.*?):(.*?)]]/g, (match, color, content) => {
        return `<span style="color:${color}">${content}</span>`;
      });
      // Convert line breaks to <br> tags
      html = html.replace(/\n/g, '<br>');
      return html;
    };

    /* Default row settings for built-in (non-lane) rows — item 12 */
    const DEFAULT_ROW_SETTINGS = {
      ex: { icon: '⚠️', label: 'Common Exceptional Flow', bg: '#fff7ed', border: '#d9760c', text: '#a5530b', hidden: false },
      help: { icon: '💡', label: 'In-journey Digital Help', bg: '#fdfcf0', border: '#d4ac0d', text: '#7d6608', hidden: false },
      systems: { icon: '🔧', label: 'Systems & Technology', bg: '#f8fafc', border: '#475569', text: '#334155', hidden: false },
      sentiment: { icon: '😊', label: 'Sentiment Curve', bg: '#fafff6', border: '#16a34a', text: '#166534', hidden: false },
    };

    const Store = {
      async get(k) { try { const v = localStorage.getItem(k); return v ? { value: v } : null; } catch (e) { console.error(e); return null; } },
      async set(k, v) { try { localStorage.setItem(k, v); return { value: v }; } catch (e) { console.error(e); return null; } },
      async delete(k) { try { localStorage.removeItem(k); return { deleted: true }; } catch (e) { console.error(e); return null; } },
      async list(p) { try { const keys = Object.keys(localStorage).filter(k => k.startsWith(p)); return { keys }; } catch (e) { console.error(e); return { keys: [] }; } }
    };

    /* ── INIT DATA ── */
    /* ── AUTO-NUMBER HELPER ── */
    function getNextStepNumber(data) {
      if (!data.stages || data.stages.length === 0) return '1';
      let lastStageIdx = -1;
      for (let i = data.stages.length - 1; i >= 0; i--) {
        const st = data.stages[i];
        const hasHappySteps = (st.happyFlow?.rows || []).some(r => r.steps?.length > 0);
        const hasLaneSteps = Object.values(st.lanes || {}).some(lane => lane.rows?.some(row => row.steps?.length > 0));
        if (hasHappySteps || hasLaneSteps) { lastStageIdx = i; break; }
      }
      if (lastStageIdx === -1) return '1';
      return String(lastStageIdx + 2);
    }

    const DEFAULT_STAGE_WIDTH = 240;
    const SCREEN_WIDTH = 100;
    const SCREEN_HEIGHT = 225;
    const PHASE_GAP = 30;

    const INIT = {
      title: 'New Journey Map', version: 'V1',
      activePersona: '',
      defaultStageWidth: DEFAULT_STAGE_WIDTH,
      autoNumber: false,
      personas: [],
      markets: {},
      lanes: [],
      notes: '',
      manualConnectors: [],
      stages: [
        {
          id: 's1', name: 'Stage 1', screens: [null],
          happyFlow: { rows: [{ id: uid(), name: 'Row 1', steps: [] }] },
          lanes: [],
          compliance: { flagged: false, citation: '', owner: '', note: '' },
        },
      ],
      upcomingProjects: [],
      links: [],
      fontSizes: {
        stepDesc: 11,
        stepSubDesc: 9.5,
        stageName: 10,
        laneLabel: 11,
        systemsText: 10.5,
      },
    };

    /* ── MODAL SHELL ── */
    function Modal({ title, onClose, children, wide, xl, disableOverlayClose, hideClose }) {
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && (typeof disableOverlayClose !== 'undefined' && disableOverlayClose ? null : onClose())}>
          <div className={`modal-box${wide ? ' wide' : ''}${xl ? ' xl' : ''}`}>
            <div className="mhead">
              <span className="mtitle">{title}</span>
              {/* Conditionally render the close button unless hideClose is true */}
              {!hideClose && <button className="mclose" onClick={onClose}>✕</button>}
            </div>
            {children}
          </div>
        </div>
      );
    }
    function Toggle({ on, onToggle, label }) {
      return (<div className="toggle-row" onClick={onToggle}><div className={`sw${on ? ' on' : ''}`}><div className="sw-k" /></div><span style={{ fontSize: 12 }}>{label}</span></div>);
    }

    /* ── STEP CARD ── */
    function StepCard({ step, borderColor, textColor, editMode, forceExpand, onEdit, onDelete, onDuplicate, onDropOnCard, onKeyFinding, isHappy, onFindingClick, onDragStart, path, stId, onConnectorHandleClick, fontSizes }) {
      const [isExpanded, setIsExpanded] = useState(false);
      const ct = type => CONN_TYPES.find(t => t.v === type) || { c: '#888', l: type };
      const additionalDescriptions = getAdditionalDescriptions(step);
      // Support both the newer multi-item `keyFindings` and legacy single `keyFinding`.
      const legacyFinding = String(step?.keyFinding || '').trim();
      const findings = [...(step.keyFindings || []), ...(legacyFinding ? [legacyFinding] : [])]
        .map(v => String(v || '').trim())
        .filter(Boolean)
        .filter((v, i, a) => a.indexOf(v) === i);
      // Notifications are stored as per-channel items; group by message for display.
      const notifGroups = (() => {
        const m = new Map();
        (step.notifications || []).forEach(n => {
          const text = String(n?.text || '').trim();
          const icon = String(n?.icon || '').trim();
          if (!text || !icon) return;
          if (!m.has(text)) m.set(text, new Set());
          m.get(text).add(icon);
        });
        return Array.from(m.entries()).map(([text, iconsSet]) => ({
          text,
          icons: ['mobile', 'email', 'chat'].filter(k => iconsSet.has(k))
        }));
      })();
      const hasFindings = findings.length > 0;
      const hasNotifications = notifGroups.length > 0;
      const hasSeparator = additionalDescriptions.length > 0 || (step.connects?.length || 0) > 0 || editMode;
      const isOpen = !!forceExpand || isExpanded;
      const hasAnyExpansion = (editMode || hasFindings) || (editMode || hasNotifications);

      const ConnectorHandles = () => editMode ? (
        <>
          {['top', 'right', 'bottom', 'left'].map(side => (
            <span
              key={side}
              className={`connector-handle connector-handle-${side}`}
              title={`Connect from ${side}`}
              onClick={(e) => {
                e.preventDefault();
                e.stopPropagation();
                onConnectorHandleClick && onConnectorHandleClick({ sid: step.id, stId, path, side }, e);
              }}
            />
          ))}
        </>
      ) : null;

      const dropProps = editMode ? {
        onDragOver: e => { e.preventDefault(); e.stopPropagation(); },
        onDrop: e => {
          e.preventDefault(); e.stopPropagation();
          try {
            const d = JSON.parse(e.dataTransfer.getData('jmb/card'));
            if (d && d.sid && onDropOnCard) onDropOnCard(d.path, d.stId, d.sid, d.rowId);
          } catch (err) { }
        }
      } : {};

      const CardActions = () => editMode ? (
        <div className="ea" style={{ marginTop: 8, justifyContent: 'flex-start' }}>
          <button className="cedit" style={{ borderColor: borderColor, color: borderColor }} onClick={onEdit}>Edit</button>
          <button className="cedit" style={{ borderColor: borderColor, color: borderColor, maxWidth: 30 }} onClick={onDuplicate}>📑</button>
          <button className="cedit" style={{ borderColor: '#e74c3c', color: '#e74c3c', maxWidth: 30 }} onClick={onDelete}>✕</button>
        </div>
      ) : null;

      // Icons
      const LockIcon = () => (
        <svg className="c-lock-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
      );
      const BoltIcon = () => (
        <svg style={{ width: 22, height: 22, color: '#fbbf24' }} fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
      );
      const AlternateIcon = () => (
        <span title="Alternate flow" style={{ fontSize: 18, lineHeight: 1, color: '#3B82F6', fontWeight: 900 }}>🔀</span>
      );
      const BellIcon = () => (
        <svg className="c-bell-icon" style={{ color: borderColor }} fill="currentColor" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
      );
      const InfoIcon = () => (
        <svg className="c-finding-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      );

      const StepHeader = () => (
        <div className="c-header">
          <div className="c-header-top">
            <div className={`c-step-box${!isHappy ? ' outlined' : ''}`} style={{ background: isHappy ? borderColor : 'transparent', color: isHappy ? '#fff' : borderColor, borderColor: borderColor }}>
              {step.number || '1'}
            </div>
            <div className="c-pills">
              {(step.customBadges || []).map((b, i) => (
                <span key={i} className="c-pill" style={{ background: b.color + '15', color: b.color }}>{b.text}</span>
              ))}
            </div>
            <div className="c-icons">
              {step.isFriction && <BoltIcon />}
              {step.isAlternate && <AlternateIcon />}
            </div>
          </div>
          <div className="c-title-area">
            {step.iconImage
              ? <img className="c-lock-icon-img" src={step.iconImage} alt="icon" />
              : step.icon
                ? <span className="c-lock-icon-emoji" aria-hidden="true">{step.icon}</span>
                : null
            }
            <div className={`c-title${step.isDeleted ? ' is-deleted' : ''}`} style={{ fontSize: `${fontSizes?.stepDesc || 16}px`, color: borderColor }} dangerouslySetInnerHTML={{ __html: renderStepText(step.description) }} />
          </div>
        </div>
      );

      const StepBody = () => (
        <div className="c-body">
          {additionalDescriptions.length > 0 && (
            <div className="c-list">
              {additionalDescriptions.map((item, idx) => (
                <div key={idx} className="c-list-item">
                  <div className="c-list-item-num">{idx + 1}</div>
                  <div dangerouslySetInnerHTML={{ __html: renderStepText(item) }} />
                </div>
              ))}
            </div>
          )}
          {step.connects?.length > 0 && (
            <div className="step-connects" style={{ marginTop: 4 }}>
              {step.connects.map((c, i) => (
                <span key={c.id || i} className="conn-chip" style={{ background: ct(c.type).c + '11', border: `1px solid ${ct(c.type).c}`, color: ct(c.type).c, fontSize: 10 }}>
                  → {c.to}
                </span>
              ))}
            </div>
          )}
          <CardActions />
        </div>
      );

      const StepExpansion = () => (isOpen && hasAnyExpansion) ? (
        <div className="c-expansion">
          {/* Render the collapse control in the first visible section header. */}
          {(editMode || hasFindings) && <div className="c-section">
            <div className="c-section-header">
              <span className="c-section-title">Key Findings</span>
              <div className="c-collapse-btn" onClick={() => setIsExpanded(false)}>−</div>
            </div>
            <div className="c-section-text" style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {hasFindings ? (
                findings.map((f, i) => <div key={i}>• {f}</div>)
              ) : (
                <div style={{ opacity: 0.5 }}>No key findings recorded.</div>
              )}
            </div>
          </div>}
          {(editMode || hasNotifications) && <div className="c-section">
            <div className="c-section-header">
              <span className="c-section-title">Notifications</span>
              {!(editMode || hasFindings) && <div className="c-collapse-btn" onClick={() => setIsExpanded(false)}>−</div>}
            </div>
            <div className="c-section-text" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {hasNotifications ? (
                notifGroups.map((n, i) => (
                  <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                    <span style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 14 }}>
                      {n.icons.includes('mobile') && <span title="App">📱</span>}
                      {n.icons.includes('email') && <span title="Email">✉️</span>}
                      {n.icons.includes('chat') && <span title="Chat">💬</span>}
                    </span>
                    <div>{n.text}</div>
                  </div>
                ))
              ) : (
                <div style={{ opacity: 0.5 }}>No notifications defined.</div>
              )}
            </div>
          </div>}
        </div>
      ) : null;

      const StepFooter = () => (
        (!editMode && !hasFindings && !hasNotifications) ? null : (
          <div className="c-footer">
            {(editMode || hasFindings) && (
              <div className="c-footer-trigger" onClick={(e) => { e.stopPropagation(); setIsExpanded(true); }}>
                <div className="c-finding-count">
                  <InfoIcon />
                  <span>{findings.length} Finding{findings.length !== 1 ? 's' : ''}</span>
                </div>
              </div>
            )}
            {!(editMode || hasFindings) && <div style={{ flex: 1 }} />}
            {(editMode || hasNotifications) && (
              <div className="c-footer-trigger" onClick={(e) => { e.stopPropagation(); setIsExpanded(true); }}>
                <BellIcon />
              </div>
            )}
          </div>
        )
      );

      return (
        <div
          className={`${isHappy ? 'card-v1' : 'card-v2'}${step.isDeleted ? ' card-deleted' : ''}`}
          style={{ borderColor: borderColor }}
          data-step-num={step.number || ''}
          data-step-id={step.id}
          data-stage-id={stId}
          data-step-path={path}
          draggable={editMode}
          onDragStart={editMode ? onDragStart : undefined}
          {...dropProps}
        >
          <ConnectorHandles />
          {step.isDeleted && <span className="del-badge">Deleted</span>}
          <StepHeader />
          {hasSeparator && <div className="c-divider" style={{ background: borderColor }} />}
          <StepBody />
          <StepExpansion />
          {!isOpen && <StepFooter />}
        </div>
      );
    }

    /* ── STEP MODAL ── */
    function StepModal({ data, path, stId, step, modalTitle, onSave, onClose, nextNum }) {
      const isNew = !step || step._new;
      const [num, setNum] = useState(isNew ? (nextNum || '') : (step?.number || ''));
      const [desc, setDesc] = useState(step?.description || '');
      const [additionalDescs, setAdditionalDescs] = useState(getAdditionalDescriptions(step));
      const [emo, setEmo] = useState(step?.emotion || '');
      const [friction, setFriction] = useState(!!step?.isFriction);
      const [alt, setAlt] = useState(!!step?.isAlternate);
      const [deleted, setDeleted] = useState(!!step?.isDeleted);
      const [icon, setIcon] = useState(step?.icon || '');
      const [iconImage, setIconImage] = useState(step?.iconImage || '');

      // Multi-item States
      const [findings, setFindings] = useState(step?.keyFindings || (step?.keyFinding ? [step.keyFinding] : []));
      const [badges, setBadges] = useState(step?.customBadges || (step?.customBadge ? [step.customBadge] : []));
      const [notifItems, setNotifItems] = useState(() => {
        const m = new Map();
        (step?.notifications || []).forEach(n => {
          const text = String(n?.text || '').trim();
          const icon = String(n?.icon || '').trim();
          if (!text || !icon) return;
          if (!m.has(text)) m.set(text, { text, channels: { mobile: false, email: false, chat: false } });
          const it = m.get(text);
          if (icon === 'mobile' || icon === 'email' || icon === 'chat') it.channels[icon] = true;
        });
        const items = Array.from(m.values());
        return items.length > 0 ? items : [{ text: '', channels: { mobile: true, email: false, chat: false } }];
      });

      const [conns, setConns] = useState((step?.connects || []).map(c => ({
        id: c.id || uid(),
        to: c.to || '',
        type: c.type === 'alternate' ? 'alternate' : 'exception',
        label: c.label || '',
        style: ['straight', 'curved', 'orthogonal'].includes(c.style) ? c.style : 'orthogonal',
      })));
      const [newTo, setNewTo] = useState('');
      const [newType, setNewType] = useState(step?.isAlternate ? 'alternate' : 'exception');
      const [newLabel, setNewLabel] = useState('');
      const [newStyle, setNewStyle] = useState('orthogonal');

      const addConn = () => {
        if (!newTo.trim()) return;
        setConns([...conns, { id: uid(), to: newTo.trim(), type: newType, label: newLabel.trim(), style: newStyle }]);
        setNewTo('');
        setNewLabel('');
      };

      const ct = type => CONN_TYPES.find(t => t.v === type) || { c: '#888', l: type };

      return (
        <Modal title={modalTitle || (isNew ? 'Add Step' : 'Edit Step')} onClose={onClose} xl disableOverlayClose={true}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 340px', gap: 24 }}>
            {/* Left Column: Core Content */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={{ display: 'grid', gridTemplateColumns: '80px 80px 1fr', gap: 12 }}>
                <div className="fg">
                  <label className="flabel">No.</label>
                  <input className="finput" style={{ textAlign: 'center', fontWeight: 800 }} value={num} onChange={e => setNum(e.target.value)} disabled={data.autoNumber} />
                </div>
                <div className="fg">
                  <label className="flabel">Icon</label>
                  <select className="finput" value={icon} onChange={e => setIcon(e.target.value)} style={{ padding: '0 4px', textAlign: 'center' }}>
                    <option value="">—</option>
                    {LANE_ICONS.map(ic => <option key={ic} value={ic}>{ic}</option>)}
                  </select>
                </div>
                <div className="fg">
                  <label className="flabel">Primary Title / Action</label>
                  <textarea className="finput" rows={2} value={desc} onChange={e => setDesc(e.target.value)} />
                </div>
              </div>

              <div className="fg">
                <label className="flabel">Icon Image (Optional)</label>
                <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                  <input
                    className="finput"
                    style={{ padding: '6px 8px', maxWidth: 320 }}
                    type="file"
                    accept="image/*"
                    onChange={(e) => {
                      const f = e.target.files && e.target.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = () => setIconImage(String(r.result || ''));
                      r.readAsDataURL(f);
                      e.target.value = '';
                    }}
                  />
                  {iconImage && (
                    <>
                      <img src={iconImage} alt="icon preview" style={{ width: 28, height: 28, objectFit: 'contain', borderRadius: 6, border: '1px solid #e2e8f0', background: '#fff' }} />
                      <button className="btn btn-sm" onClick={() => setIconImage('')}>Remove</button>
                    </>
                  )}
                  {!iconImage && <span style={{ fontSize: 11.5, color: 'var(--muted)' }}>If set, this image is shown on the card (scaled to fit).</span>}
                </div>
              </div>

              <div className="fg">
                <label className="flabel" style={{ fontWeight: 400 }}>Additional Details (Non-bold list items)</label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {additionalDescs.map((item, idx) => (
                    <div key={idx} style={{ display: 'flex', gap: 8 }}>
                      <input className="finput" value={item} onChange={e => setAdditionalDescs(additionalDescs.map((v, i) => i === idx ? e.target.value : v))} />
                      <button className="btn btn-sm" onClick={() => setAdditionalDescs(additionalDescs.filter((_, i) => i !== idx))}>✕</button>
                    </div>
                  ))}
                  <button className="btn btn-outline btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setAdditionalDescs([...additionalDescs, ''])}>＋ Add Detail</button>
                </div>
              </div>

              <div className="fg">
                <label className="flabel">Key Findings</label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {findings.map((f, idx) => (
                    <div key={idx} style={{ display: 'flex', gap: 8 }}>
                      <textarea className="finput" rows={2} value={f} onChange={e => setFindings(findings.map((v, i) => i === idx ? e.target.value : v))} />
                      <button className="btn btn-sm" onClick={() => setFindings(findings.filter((_, i) => i !== idx))}>✕</button>
                    </div>
                  ))}
                  <button className="btn btn-outline btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setFindings([...findings, ''])}>＋ Add Finding</button>
                </div>
              </div>

              <div className="fg">
                <label className="flabel">Notifications</label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {notifItems.map((n, idx) => (
                    <div key={idx} style={{ padding: 10, borderRadius: 12, border: '1px solid #e2e8f0', background: '#fff' }}>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                        <textarea
                          className="finput"
                          rows={2}
                          style={{ flex: 1 }}
                          value={n.text}
                          onChange={e => setNotifItems(notifItems.map((v, i) => i === idx ? { ...v, text: e.target.value } : v))}
                          placeholder="Notification message (shared across enabled channels)"
                        />
                        <button className="btn btn-sm" onClick={() => setNotifItems(notifItems.filter((_, i) => i !== idx))} title="Remove notification">✕</button>
                      </div>
                      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center', marginTop: 8 }}>
                        <label style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 12, color: 'var(--text)' }}>
                          <input type="checkbox" checked={!!n.channels.mobile} onChange={() => setNotifItems(notifItems.map((v, i) => i === idx ? { ...v, channels: { ...v.channels, mobile: !v.channels.mobile } } : v))} />
                          📱 App
                        </label>
                        <label style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 12, color: 'var(--text)' }}>
                          <input type="checkbox" checked={!!n.channels.email} onChange={() => setNotifItems(notifItems.map((v, i) => i === idx ? { ...v, channels: { ...v.channels, email: !v.channels.email } } : v))} />
                          ✉️ Email
                        </label>
                        <label style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 12, color: 'var(--text)' }}>
                          <input type="checkbox" checked={!!n.channels.chat} onChange={() => setNotifItems(notifItems.map((v, i) => i === idx ? { ...v, channels: { ...v.channels, chat: !v.channels.chat } } : v))} />
                          💬 Chat
                        </label>
                      </div>
                    </div>
                  ))}
                  <button className="btn btn-outline btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setNotifItems([...notifItems, { text: '', channels: { mobile: true, email: false, chat: false } }])}>＋ Add Notification</button>
                  <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>In preview, each message is shown once with its enabled channels.</div>
                </div>
              </div>
            </div>

            {/* Right Column: Settings & Meta */}
            <div style={{ padding: 16, background: '#f8fafc', borderRadius: 12, display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div className="fg">
                <label className="flabel">Icon / Emotion</label>
                <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                  {EMOTIONS.slice(0, 15).map(e => (
                    <button key={e || '_'} onClick={() => setEmo(e)} style={{ width: 32, height: 32, border: `2px solid ${emo === e ? 'var(--primary)' : '#e2e8f0'}`, borderRadius: 6, background: '#fff', fontSize: 16 }}>{e || '—'}</button>
                  ))}
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <Toggle on={friction} onToggle={() => setFriction(!friction)} label="⚡ Friction Point" />
                <Toggle on={alt} onToggle={() => setAlt(!alt)} label="🔀 Alternate Flow" />
                <Toggle on={deleted} onToggle={() => setDeleted(!deleted)} label="🗑️ Mark as Deleted" />
              </div>

              <div className="fg">
                <label className="flabel">Custom Badges</label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {badges.map((b, idx) => (
                    <div key={idx} style={{ display: 'flex', gap: 4 }}>
                      <input className="finput" style={{ flex: 1 }} value={b.text} onChange={e => setBadges(badges.map((v, i) => i === idx ? { ...v, text: e.target.value } : v))} />
                      <input type="color" value={b.color} onChange={e => setBadges(badges.map((v, i) => i === idx ? { ...v, color: e.target.value } : v))} style={{ width: 32, height: 32, border: 'none', padding: 0, background: 'none' }} />
                      <button className="btn btn-sm" onClick={() => setBadges(badges.filter((_, i) => i !== idx))}>✕</button>
                    </div>
                  ))}
                  <button className="btn btn-outline btn-sm" onClick={() => setBadges([...badges, { text: '', color: '#3b82f6' }])}>＋ Add Badge</button>
                </div>
              </div>

              <div className="fg">
                <label className="flabel">Step Connections</label>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {conns.map((c, i) => (
                    <div key={c.id || i} style={{ padding: 8, borderRadius: 10, border: '1px solid #e2e8f0', background: '#fff' }}>
                      <div style={{ display: 'grid', gridTemplateColumns: '70px 1fr 34px', gap: 6, alignItems: 'center' }}>
                        <input
                          className="finput"
                          placeholder="To"
                          value={c.to}
                          onChange={e => setConns(conns.map((v, j) => j === i ? { ...v, to: e.target.value } : v))}
                        />
                        <select
                          className="finput"
                          value={c.type}
                          onChange={e => setConns(conns.map((v, j) => j === i ? { ...v, type: e.target.value } : v))}
                          title="Connector type"
                        >
                          <option value="exception">Exception Flow</option>
                          <option value="alternate">Alternate Flow</option>
                        </select>
                        <button className="btn btn-sm" onClick={() => setConns(conns.filter((_, j) => j !== i))}>✕</button>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '110px 1fr', gap: 6, marginTop: 6 }}>
                        <select
                          className="finput"
                          value={c.style}
                          onChange={e => setConns(conns.map((v, j) => j === i ? { ...v, style: e.target.value } : v))}
                          title="Line style"
                        >
                          {LINE_STYLE_OPTIONS.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                        </select>
                        <input
                          className="finput"
                          placeholder="Label (optional)"
                          value={c.label}
                          onChange={e => setConns(conns.map((v, j) => j === i ? { ...v, label: e.target.value } : v))}
                        />
                      </div>
                      <div style={{ marginTop: 6 }}>
                        <span className="conn-chip" style={{ background: ct(c.type).c + '18', color: ct(c.type).c, fontSize: 10 }}>
                          → {c.to || '…'}{c.label ? ` · ${c.label}` : ''} · {ct(c.type).l}
                        </span>
                      </div>
                    </div>
                  ))}
